<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit & Food">
<meta name="theme-color" content="#ff5a2c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fit &amp; Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped coaching app, direct and encouraging, like a good trainer.
   IDEA: the gym logbook + the kitchen scale — every set ticked, every gram counted.
   PICTURE: today's calorie ring and today's workout card are the first screen.
   COLOUR and TYPE: white or near-black ground, ink, one hot orange for training, one green for food; Archivo throughout.
   LAYOUT: single phone column, bottom tab bar, sheets that slide up for detail. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1013);--card:light-dark(#f3f4f6,#1a1d22);--card2:light-dark(#e9ebef,#23272d);
--ink:light-dark(#121418,#f2f3f5);--mut:light-dark(#5b616c,#9ca3ae);--line:light-dark(#e2e4e8,#2b2f36);
--acc:#ff5a2c;--accd:light-dark(#d9431a,#ff7a52);--food:light-dark(#178a5e,#2fc488);
--p:#3b6cf6;--c:#f0a412;--f:#a35bd6;--warn:light-dark(#b54708,#f5a524)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.top b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--mut)}
h1{font-size:32px;line-height:1.05;margin:18px 0 4px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px;margin:26px 0 10px;font-weight:700}
h3{font-size:17px;margin:0 0 4px;font-weight:700}
p{margin:0 0 10px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrapr{flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:44px;padding:10px 16px;background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accd);outline-offset:2px}
.pri{background:var(--acc);color:#fff}.grn{background:var(--food);color:#fff}
.ghost{background:transparent;padding:10px 8px;color:var(--accd)}
.full{width:100%}
.ico{width:20px;height:20px;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:9px 12px;width:100%}
textarea{min-height:110px}
label.f{display:block;margin:10px 0}label.f>span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:7px 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0}
.seg button{flex:1;background:transparent;min-height:40px;border-radius:10px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 4px}
.tabs button{flex-direction:column;gap:2px;background:transparent;font-size:12px;font-weight:600;color:var(--mut);min-height:62px;padding:6px 0;border-radius:0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}.tabs button.on.fd{color:var(--food)}
/* hero */
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ringw{position:relative;width:150px;height:150px}
.ring{width:150px;height:150px}.rbg{fill:none;stroke:var(--card2);stroke-width:14}.rfg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .6s}
.ringt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringt b{font-size:30px;font-weight:800;line-height:1}.ringt span{font-size:13px;color:var(--mut)}
.mac{margin:6px 0}.mac .row{font-size:14px}.mac b{font-weight:700}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* workout */
.wk{border-radius:18px;padding:16px;margin:12px 0;background:var(--acc);color:#fff}
.wk .mut{color:rgb(255 255 255/.85)}
.wk h3{font-size:22px}
.exr{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0}
.exr .nm{font-weight:700;background:none;padding:0;min-height:auto;text-align:left;justify-content:flex-start;color:var(--ink)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;padding:0;background:var(--bg);border:2px solid var(--line);font-size:15px}
.dot.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kg{width:92px;min-height:44px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--food) 18%,transparent);color:var(--food)}
.gl{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--accd)}
.gl svg{width:22px;height:22px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-radius:0;width:100%;text-align:left;min-height:56px;font-weight:500}
.li:last-child{border-bottom:0}
.li .t{flex:1}.li .t b{display:block;font-weight:600}.li .t small{color:var(--mut);font-size:13px}
.meal h3{display:flex;justify-content:space-between}
.meal .li{padding:9px 0}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;animation:up .25s ease-out}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.rfg{transition:none}}
.demo{position:relative;border-radius:16px;overflow:hidden;background:var(--card2);aspect-ratio:3/2;margin:12px 0}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.b{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.demo .lbl{position:absolute;left:10px;bottom:10px;background:rgb(0 0 0/.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px}
.th{width:44px;height:44px;flex:none;border-radius:11px;object-fit:cover;background:var(--card2)}
@media(prefers-reduced-motion:reduce){.demo{aspect-ratio:3/1}.demo img{width:50%}.demo img.b{left:50%;animation:none}}
.steps{padding-left:22px;margin:8px 0}.steps li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:15px;max-width:90vw}
.fig{position:relative;min-height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.axt{fill:var(--mut);font-size:12px}
.wbar{display:grid;grid-template-columns:34px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.wbar .bar{height:14px;margin:0}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.water button{width:36px;height:44px;min-height:44px;padding:0;border-radius:8px;background:var(--card2)}
.water button.on{background:var(--p)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px;gap:6px;align-items:center}
.ed input{min-height:40px;padding:6px 8px}
.tool{display:flex;gap:4px}.tool button{min-height:40px;padding:6px 10px}
@media(max-width:400px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .mac{width:100%;text-align:left}h1{font-size:28px}}
</style>
</head>
<body>
<header class="top"><div class="wrap"><b id="ttl">Vandaag</b><span id="sync" class="sync">Laden…</span></div></header>
<main id="app" class="wrap"></main>
<nav class="tabs" aria-label="Hoofdmenu"><div class="wrap">
<button data-a="tab" data-t="vandaag" id="t-vandaag"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Vandaag</button>
<button data-a="tab" data-t="training" id="t-training"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9.5v5M18 7v10M21 9.5v5M6 12h12"/></svg>Training</button>
<button data-a="tab" data-t="voeding" id="t-voeding" class="fd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 7c-3-2-7-1-7 4 0 5 3 10 7 9 4 1 7-4 7-9 0-5-4-6-7-4z"/><path d="M12 7c0-2 1-4 3-4"/></svg>Voeding</button>
<button data-a="tab" data-t="voortgang" id="t-voortgang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Voortgang</button>
<button data-a="tab" data-t="profiel" id="t-profiel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profiel</button>
</div></nav>
<div id="sheetBg" class="sheetbg" hidden data-a="close"></div>
<section id="sheet" class="sheet" hidden role="dialog" aria-modal="true"></section>
<div id="toast" class="toast" hidden></div>
<input type="file" id="labelIn" accept="image/*" hidden>
<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return iso(d)};
const wdOf=s=>new Date(s+'T12:00:00').getDay();
const DOW=['zo','ma','di','wo','do','vr','za'];
const DOWL=['zondag','maandag','dinsdag','woensdag','donderdag','vrijdag','zaterdag'];
const MON=['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
const fdate=s=>{const d=new Date(s+'T12:00:00');return DOWL[d.getDay()]+' '+d.getDate()+' '+MON[d.getMonth()]};
const MEALS=['Ontbijt','Lunch','Diner','Tussendoor'];
const uid=()=>Math.random().toString(36).slice(2,10);
const clone=o=>JSON.parse(JSON.stringify(o));

/* ---------- Oefeningen ---------- */
const GROUPS={benen:'Benen',billen:'Billen',borst:'Borst',rug:'Rug',schouders:'Schouders',armen:'Armen',core:'Core',cardio:'Cardio',mobiliteit:'Mobiliteit'};
const EQ={geen:'Lichaamsgewicht',dumbbell:'Dumbbells',barbell:'Barbell',machine:'Machine',kabel:'Kabel',band:'Weerstandsband',kettlebell:'Kettlebell',stang:'Optrekstang'};
const HOME_EQ=['geen','dumbbell','band','kettlebell'];
const INJ={knie:'Knie',schouder:'Schouder',onderrug:'Onderrug',heup:'Heup',pols:'Pols',elleboog:'Elleboog',nek:'Nek',enkel:'Enkel'};
// id, naam, engelse zoekterm, groep, materiaal, belaste gewrichten, stappen, tip
const EXR_RAW=[
['bw_squat','Squat (lichaamsgewicht)','bodyweight squat','benen','geen','knie,heup','Voeten op heupbreedte, tenen licht naar buiten.|Zak met je billen naar achter en omlaag alsof je gaat zitten.|Houd je knieën in lijn met je tenen en je borst omhoog.|Duw via je hielen terug omhoog.','Ga zo diep als je kunt zonder dat je onderrug bol trekt.'],
['goblet','Goblet squat','goblet squat','benen','dumbbell','knie','Houd een dumbbell verticaal tegen je borst.|Zak recht omlaag tussen je knieën, ellebogen langs de binnenkant van je knieën.|Houd je hielen aan de grond.|Kom krachtig omhoog en span je billen aan.','Het gewicht vóór je helpt je rechtop te blijven: ideaal om squatten te leren.'],
['bb_squat','Barbell squat','barbell back squat','benen','barbell','knie,onderrug,heup','Leg de stang op je bovenrug, niet op je nek.|Adem in, span je buik aan en zak gecontroleerd tot je dijen minstens horizontaal zijn.|Knieën naar buiten duwen, rug neutraal.|Duw omhoog en adem uit bovenin.','Gebruik de veiligheidssteunen in het rek.'],
['legpress','Leg press','leg press machine','benen','machine','knie','Ga met je rug en billen plat tegen het kussen zitten.|Voeten op heupbreedte midden op het platform.|Laat het platform zakken tot je knieën ongeveer 90 graden zijn.|Duw terug zonder je knieën op slot te zetten.','Laat je billen niet van het kussen komen onderin.'],
['lunge','Lunges','forward lunge','benen','geen','knie,heup','Sta rechtop, handen op je heupen.|Stap een grote stap naar voren.|Zak tot beide knieën ongeveer 90 graden zijn; achterste knie net boven de grond.|Duw je terug naar de start en wissel van been.','Voorste knie blijft boven je enkel, niet ver voorbij je tenen.'],
['bulgarian','Bulgarian split squat','bulgarian split squat','benen','dumbbell','knie,heup','Leg je achterste voet op een bank.|Houd in elke hand een dumbbell.|Zak recht omlaag op je voorste been.|Duw via je voorste hiel omhoog. Doe alle herhalingen en wissel.','Licht voorover leunen legt meer nadruk op je billen.'],
['stepup','Step-up','dumbbell step up','benen','dumbbell','knie','Sta voor een stevige bank of trede.|Zet je hele voet op de bank.|Stap omhoog door je voorste been te strekken, niet afzetten met het achterste.|Stap gecontroleerd terug.','Kies een lagere trede als je knie gevoelig is.'],
['wallsit','Wall sit','wall sit','benen','geen','knie','Leun met je rug tegen een muur.|Schuif omlaag tot je knieën ongeveer 90 graden zijn.|Houd deze positie vast, gewicht op je hielen.','Blijf rustig doorademen.'],
['rdl','Roemeense deadlift','romanian deadlift dumbbell','benen','dumbbell','onderrug','Sta met dumbbells voor je dijen, knieën licht gebogen.|Duw je heupen naar achter en laat de gewichten langs je benen zakken.|Houd je rug recht tot je rek voelt in je hamstrings.|Kom omhoog door je heupen naar voren te duwen.','Het is een heupbeweging, geen buiging uit je rug.'],
['deadlift','Deadlift','barbell deadlift','benen','barbell','onderrug,heup','Stang boven je middenvoet, voeten op heupbreedte.|Pak de stang net buiten je knieën, rug recht, borst vooruit.|Duw de vloer weg en strek knieën en heupen tegelijk.|Laat gecontroleerd zakken langs je benen.','Houd de stang dicht tegen je lichaam.'],
['legcurl','Leg curl','lying leg curl machine','benen','machine','','Lig op je buik, kussen net boven je hielen.|Buig je knieën en trek het kussen richting je billen.|Laat langzaam terugzakken.','Houd je heupen op het kussen.'],
['legext','Leg extension','leg extension machine','benen','machine','knie','Ga zitten met het kussen op je scheenbenen.|Strek je benen volledig.|Laat langzaam zakken.','Gebruik een licht gewicht en beweeg gecontroleerd.'],
['calf','Kuitheffen','standing calf raise','benen','geen','enkel','Sta met je voorvoeten op een trede.|Kom zo hoog mogelijk op je tenen.|Zak langzaam tot onder de trede.','Pauzeer een tel bovenin.'],
['glutebridge','Glute bridge','glute bridge','billen','geen','','Lig op je rug, knieën gebogen, voeten plat.|Duw je heupen omhoog tot een rechte lijn van knie tot schouder.|Knijp je billen een tel aan bovenin.|Zak gecontroleerd.','Duw via je hielen, niet via je tenen.'],
['hipthrust','Hip thrust','barbell hip thrust','billen','barbell','','Zit met je bovenrug tegen een bank, stang over je heupen (met kussen).|Voeten plat, op heupbreedte.|Duw je heupen omhoog tot je romp horizontaal is.|Zak gecontroleerd.','Kin licht ingetrokken, kijk naar voren.'],
['clam','Clamshell met band','clamshell resistance band','billen','band','','Lig op je zij met een band om je knieën, knieën gebogen.|Houd je voeten tegen elkaar en open je bovenste knie.|Sluit langzaam. Wissel van kant.','Je heup mag niet naar achter rollen.'],
['pushup','Push-up','push up','borst','geen','pols,schouder','Handen iets breder dan je schouders.|Lichaam in een rechte lijn, buik aangespannen.|Zak tot je borst net boven de grond is, ellebogen op 45 graden.|Duw jezelf terug omhoog.','Te zwaar? Kies push-up op knieën of incline.'],
['kneepushup','Push-up op knieën','knee push up','borst','geen','pols','Steun op je handen en knieën.|Lichaam recht van knie tot hoofd.|Zak met je borst richting de grond.|Duw terug omhoog.','Een goede opstap naar volledige push-ups.'],
['inclinepushup','Incline push-up','incline push up','borst','geen','pols','Zet je handen op een bank of aanrecht.|Loop met je voeten naar achter tot je lichaam recht is.|Zak met je borst naar de rand.|Duw terug.','Hoe hoger je handen, hoe lichter.'],
['benchpress','Bankdrukken','barbell bench press','borst','barbell','schouder,pols','Lig op de bank, ogen onder de stang.|Schouderbladen naar achter en omlaag.|Laat de stang zakken naar je onderste borst.|Druk omhoog en een beetje richting je ogen.','Train zwaar alleen met een spotter.'],
['dbpress','Dumbbell bench press','dumbbell bench press','borst','dumbbell','schouder','Lig op een bank met een dumbbell in elke hand boven je borst.|Laat de gewichten zakken tot naast je borst.|Druk ze weer omhoog tot boven je borst.','Dumbbells zijn vriendelijker voor je schouders dan een stang.'],
['inclinedb','Incline dumbbell press','incline dumbbell press','borst','dumbbell','schouder','Zet de bank op 30 graden.|Begin met dumbbells naast je bovenste borst.|Druk omhoog en iets naar elkaar toe.|Laat gecontroleerd zakken.','Traint vooral je bovenste borst.'],
['chestpress','Chest press machine','chest press machine','borst','machine','schouder','Stel de stoel zo in dat de handvatten op borsthoogte zitten.|Duw de handvatten naar voren.|Laat langzaam terugkomen.','Goede keuze voor beginners: de machine stuurt de beweging.'],
['cablefly','Cable fly','cable chest fly','borst','kabel','schouder','Sta tussen twee kabels, handvatten op schouderhoogte.|Armen licht gebogen.|Breng je handen in een boog voor je borst samen.|Laat langzaam terugkomen.','Voel de rek, maar ga niet verder dan prettig.'],
['pullup','Pull-up','pull up','rug','stang','schouder,elleboog','Hang aan de stang, handen iets breder dan schouders.|Trek je schouderbladen omlaag.|Trek jezelf op tot je kin boven de stang.|Zak gecontroleerd.','Gebruik een band of assistmachine als het nog niet lukt.'],
['latpull','Lat pulldown','lat pulldown','rug','machine','schouder','Ga zitten, knieën onder het kussen.|Pak de stang breed vast.|Trek de stang naar je bovenste borst, ellebogen naar beneden.|Laat langzaam terug.','Niet achter je nek trekken.'],

async function flush(key){
  if(busy[key]){pend[key]=1;return}
  busy[key]=1;
  try{
    const body=key==='main'?mainBody():{date:key.slice(2),...(S.days[key.slice(2)]||{})};
    await DB.collection('data/users/'+UID).doc(key).set(clone(body));setSync('ok');
  }catch(e){setSync('err');setTimeout(()=>{if(!pend[key])flush(key)},4000)}
  busy[key]=0;if(pend[key]){pend[key]=0;flush(key)}
}
async function initDb(){
  try{
    if(!window.claude||!window.claude.use){setSync('local');return}
    const u=await window.claude.use('user');DB=await window.claude.use('db');
    UID=u&&u.id?await u.id():null;
    if(!DB||!UID){DB=null;setSync('local');return}
    const to=setTimeout(()=>setSync('slow'),10000);
    const col=DB.collection('data/users/'+UID);
    const m=await col.doc('main').get();
    if(m.exists){const d=clone(m.data());S={...S,...d,profile:{...DEF_PROFILE,...(d.profile||{})},days:S.days}}
    else if(S.profile.set||S.plans.length){flush('main')}
    const q=await col.where('date','>=',addDays(today(),-120)).get();
    const remote=new Set();
    q.docs.forEach(s=>{const x=clone(s.data());if(x&&x.date){remote.add(x.date);const dt=x.date;delete x.date;S.days[dt]=x}});
    if(!m.exists)Object.keys(S.days).forEach(dt=>{if(!remote.has(dt))flush('d-'+dt)});

/* ---------- Berekeningen ---------- */
function targets(){
  const p=S.profile,kg=+p.kg||75,cm=+p.cm||178,age=+p.age||35,male=p.sex!=='v';
  const bmr=10*kg+6.25*cm-5*age+(male?5:-161),tdee=bmr*(+p.act||1.375);
  let kcal=tdee;
  if(p.goal==='afvallen')kcal=Math.max(tdee-750,tdee*0.8);
  if(p.goal==='spier')kcal=tdee+Math.min(300,tdee*0.1);
  kcal=Math.max(male?1500:1200,Math.round(kcal/10)*10);
  const m2=(cm/100)**2,bmi=kg/m2,refKg=bmi>30?27*m2:kg;
  const pk={afvallen:2.0,spier:1.8,behoud:1.6,fit:1.6}[p.goal]||1.6;
  const prot=Math.round(refKg*pk),fat=Math.round(kcal*0.28/9),carb=Math.max(0,Math.round((kcal-prot*4-fat*9)/4));
  return {bmr:Math.round(bmr),tdee:Math.round(tdee),kcal,p:prot,c:carb,f:fat,bmi};
}
const itemTot=e=>({k:e.k*e.g/100,p:e.p*e.g/100,c:e.c*e.g/100,f:e.f*e.g/100});
const sumFood=list=>list.reduce((s,e)=>{const t=itemTot(e);s.k+=t.k;s.p+=t.p;s.c+=t.c;s.f+=t.f;return s},{k:0,p:0,c:0,f:0});
const R=Math.round;
const conflicts=e=>e.inj.filter(i=>(S.profile.inj||[]).includes(i));
const allowedEq=eq=>S.profile.loc==='thuis'?HOME_EQ.includes(eq):true;
function safeAlt(e){return EXR.find(x=>x.g===e.g&&x.id!==e.id&&!conflicts(x).length&&allowedEq(x.eq))}
const portionTxt=(f,g)=>{if(!f||!f.pg||f.pn==='portie')return '';const n=Math.round(g/f.pg*2)/2;return n>0?` · ≈${String(n).replace('.',',')} ${f.pn}`:''};

/* ---------- Schema-generator ---------- */
const SLOTS={SQ:['bb_squat','goblet','legpress','bw_squat','wallsit','glutebridge'],SQ2:['legpress','goblet','bw_squat','stepup','glutebridge'],HINGE:['rdl','deadlift','kbswing','hipthrust','glutebridge','legcurl'],GLUTE:['hipthrust','glutebridge','clam'],LEGCURL:['legcurl','rdl','glutebridge'],LUNGE:['bulgarian','lunge','stepup','clam','glutebridge'],CALF:['calf'],PUSH_H:['benchpress','dbpress','chestpress','pushup','inclinepushup','kneepushup'],PUSH_H2:['inclinedb','cablefly','inclinepushup','kneepushup'],PUSH_V:['dbshoulder','ohp','lateral','bandpull'],LATERAL:['lateral','reardelt'],PULL_V:['latpull','pullup','dbrow','seatedrow','bandpull'],PULL_H:['seatedrow','dbrow','bbrow','bandpull'],REAR:['facepull','reardelt','bandpull'],ARMS_B:['curl','hammer'],ARMS_T:['triceppush','overheadext','dips'],CORE:['plank','deadbug','birddog','pallof'],CORE2:['deadbug','pallof','sideplank','birddog','crunch'],CARDIO:['bike','walk','row']};
const DT={FA:['Full body A',['SQ','PUSH_H','PULL_H','HINGE','REAR','CORE']],FB:['Full body B',['HINGE','PUSH_V','PULL_V','LUNGE','ARMS_B','CORE2']],FC:['Full body C',['LUNGE','PUSH_H2','PULL_V','GLUTE','ARMS_T','CORE']],UA:['Bovenlichaam A',['PUSH_H','PULL_H','PUSH_V','PULL_V','ARMS_B','ARMS_T']],LA:['Onderlichaam A',['SQ','HINGE','LUNGE','CALF','CORE']],UB:['Bovenlichaam B',['PUSH_V','PULL_V','PUSH_H2','PULL_H','REAR','CORE2']],LB:['Onderlichaam B',['HINGE','SQ2','GLUTE','LEGCURL','CALF','CORE']],PU:['Push (duwen)',['PUSH_H','PUSH_V','PUSH_H2','LATERAL','ARMS_T']],PL:['Pull (trekken)',['PULL_V','PULL_H','REAR','ARMS_B','CORE2']],LG:['Benen',['SQ','HINGE','LUNGE','CALF','CORE']]};
const SPLIT={2:[['FA',1],['FB',4]],3:[['FA',1],['FB',3],['FC',5]],4:[['UA',1],['LA',2],['UB',4],['LB',5]],5:[['PU',1],['PL',2],['LG',3],['UA',5],['LB',6]]};
function scheme(id,goal){
  const e=EX[id];
  if(e.g==='cardio'&&id!=='kbswing')return {sets:1,reps:'10-15 min',rest:0};
  if(TIMED.includes(id))return {sets:3,reps:'30-45 s',rest:45};
  if(e.g==='core'||id==='kbswing'||id==='clam'||id==='bandpull')return {sets:3,reps:'12-15',rest:45};
  const big=['bb_squat','deadlift','benchpress','ohp','bbrow','hipthrust','legpress','rdl'].includes(id);
  if(goal==='spier')return {sets:big?4:3,reps:big?'6-10':'8-12',rest:big?120:75};
  if(goal==='afvallen')return {sets:3,reps:'10-15',rest:60};
  return {sets:3,reps:'8-12',rest:75};
}
function genPlan(){
  const p=S.profile,n=Math.min(5,Math.max(2,+p.days||3));
  const pick=(slot,used)=>{
    let c=SLOTS[slot].map(id=>EX[id]).filter(e=>allowedEq(e.eq)&&!conflicts(e).length&&!used.includes(e.id));
    if(p.lvl==='beginner')c.sort((a,b)=>(a.eq==='barbell')-(b.eq==='barbell'));
    return c[0];
  };
  const days=SPLIT[n].map(([k,wd])=>{
    const [nm,slots]=DT[k];const used=[];const ex=[];
    slots.forEach(s=>{const e=pick(s,used);if(e){used.push(e.id);ex.push({id:e.id,...scheme(e.id,p.goal)})}});
    if(p.goal==='afvallen'||p.goal==='fit'){const c=pick('CARDIO',used);if(c)ex.push({id:c.id,...scheme(c.id,p.goal)})}
    return {name:nm,wd:[wd],ex};
  });
  const goalN={afvallen:'Afvallen',spier:'Spieropbouw',behoud:'Fit blijven',fit:'Conditie'}[p.goal]||'Training';
  const plan={id:uid(),name:`${goalN} · ${n}× per week`,days,auto:1};
  S.plans.push(plan);S.active=plan.id;save('main');return plan;
}
const activePlan=()=>S.plans.find(x=>x.id===S.active)||null;
function todaysWorkout(date){
  const plan=activePlan();if(!plan||!plan.days.length)return null;
  const d=peekDay(date);
  let idx=d.wk&&d.wk.plan===plan.id&&d.wk.pi!=null?d.wk.pi:plan.days.findIndex(x=>(x.wd||[]).includes(wdOf(date)));
  return idx<0||!plan.days[idx]?{plan,idx:-1}:{plan,idx,dd:plan.days[idx]};
}

/* ---------- Voedingsschema-generator ---------- */
function genMealPlan(){
  const t=targets(),veg=S.profile.diet==='veg';
  const split=t.kcal>2600?[.25,.3,.3,.15]:[.25,.3,.35,.1];
  const prev=[],days=[];
  for(let d=0;d<7;d++){
    const meals=[];
    for(let m=0;m<4;m++){
      const opts=MT[m].filter(x=>!veg||x.v);
      const cand=opts.filter(x=>x.n!==prev[m]);
      const pk=cand[Math.floor(Math.random()*cand.length)]||opts[0];prev[m]=pk.n;
      const base=pk.it.reduce((s,[n,g])=>s+(findFood(n)?.k||0)*g/100,0)||1;
      const sc=Math.max(.5,Math.min(2.2,t.kcal*split[m]/base));
      meals.push({m,n:pk.n,it:pk.it.map(([n,g])=>[n,Math.max(5,Math.round(g*sc/5)*5)])});
    }
    days.push(meals);
  }
  S.mealPlan={made:today(),kcal:t.kcal,days};save('main');
}
const mealItems=meal=>meal.it.map(([n,g])=>{const f=findFood(n)||{k:0,p:0,c:0,f:0};return {n,g,k:f.k,p:f.p,c:f.c,f:f.f}});

function ring(v,max,col,label){

function vToday(){
  const p=S.profile,t=targets(),d=peekDay(today()),tot=sumFood(d.food);
  const hr=new Date().getHours(),gr=hr<12?'Goedemorgen':hr<18?'Goedemiddag':'Goedenavond';

  h+=workoutBlock(today());

  return h;
}
function workoutBlock(date){
  const w=todaysWorkout(date);
  if(!w)return `<div class="card"><h3>Nog geen trainingsschema</h3><p class="mut sm">Maak automatisch een schema op basis van je profiel, of bouw er zelf een.</p><div class="g2"><button class="pri" data-a="genplan">Schema maken</button><button data-a="tab" data-t="training">Zelf bouwen</button></div></div>`;
  if(w.idx<0){
    const next=nextTraining(date);
    return `<div class="card"><h3>Rustdag</h3><p class="mut sm">Herstel is ook training. ${next?`Volgende training: <b>${esc(next.name)}</b> op ${next.when}.`:''}</p><button data-a="pickday">Toch trainen</button></div>`;
  }
  const d=peekDay(date),wk=d.wk&&d.wk.plan===w.plan.id&&d.wk.pi===w.idx?d.wk:{sets:{},kg:{}};
  const total=w.dd.ex.reduce((s,e)=>s+(+e.sets||0),0),done=Object.values(wk.sets||{}).reduce((s,a)=>s+a.filter(Boolean).length,0);
  let h=`<div class="wk"><div class="row sp"><div><span class="mut sm">Training van vandaag</span><h3>${esc(w.dd.name)}</h3></div><button class="ghost" style="color:#fff" data-a="pickday">Wissel</button></div><div class="bar" style="background:rgb(255 255 255/.3)"><i style="width:${total?done/total*100:0}%;background:#fff"></i></div><p class="sm mut" style="margin:6px 0 0">${done} van ${total} sets gedaan · ${w.dd.ex.length} oefeningen${wk.done?' · afgerond':''}</p></div>`;
  w.dd.ex.forEach((x,i)=>{
    const e=EX[x.id];if(!e)return;const cf=conflicts(e);const arr=(wk.sets||{})[i]||[];
    h+=`<div class="exr"><div class="row">${thumb(e)}<div class="grow"><button class="nm" data-a="exinfo" data-id="${e.id}">${esc(e.n)}</button><div class="xs mut">${x.sets} × ${esc(x.reps)}${x.rest?` · ${x.rest} s rust`:''}</div></div><a class="btn ghost" href="${vidUrl(e)}" target="_blank" rel="noopener" aria-label="Video ${esc(e.n)}"><svg class="ico" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></a></div>${cf.length?`<p class="xs" style="margin:6px 0 0"><span class="badge w">Let op: ${cf.map(c=>INJ[c]).join(', ')}</span></p>`:''}<div class="sets">${Array.from({length:+x.sets||0},(_,s)=>`<button class="dot ${arr[s]?'on':''}" data-a="set" data-d="${date}" data-i="${i}" data-s="${s}" aria-label="Set ${s+1}">${s+1}</button>`).join('')}${e.g!=='cardio'&&e.eq!=='geen'?`<input class="kg" inputmode="decimal" placeholder="kg" value="${esc((wk.kg||{})[i]||'')}" data-in="kg" data-d="${date}" data-i="${i}" aria-label="Gewicht in kg">`:''}</div></div>`;
  });
  h+=`<button class="pri full" style="margin:6px 0 10px" data-a="finish" data-d="${date}">${wk.done?'Training afgerond ✓':'Training afronden'}</button>`;
  return h;
}
const EXT_TYPES=[['Seven',8],['HIIT',8],['Hardlopen',9.8],['Fietsen',7],['Wandelen',3.8],['Zwemmen',7],['Overig',5]];
const extKcal=(t,min)=>{const met=(EXT_TYPES.find(x=>x[0]===t)||['',5])[1];return Math.round(met*(+num(S.profile.kg)||75)*min/60)};
function extBlock(date){
  const ex=peekDay(date).ext||[];
  return `<div class="card"><div class="row sp"><h3>Andere training</h3><button class="ghost" data-a="extadd">+ Toevoegen</button></div>${ex.length?ex.map((x,i)=>`<div class="li" style="cursor:default"><span class="t"><b>${esc(x.n)}</b><small>${x.min} min · ca. ${x.kcal} kcal verbrand</small></span><button class="ghost" data-a="extdel" data-i="${i}" aria-label="Verwijder">✕</button></div>`).join(''):'<p class="sm mut" style="margin:0">Bijv. je Seven-workout, hardlopen of fietsen.</p>'}</div>`;
}
function addExt(n,min,kcal,date=today()){const d=day(date);d.ext=d.ext||[];min=Math.max(1,Math.round(+min||7));d.ext.push({n,min,kcal:isFinite(+kcal)&&+kcal>0?Math.round(+kcal):extKcal(n,min)});saveDay(date)}
function nextTraining(date){

function drawW(){
  const s=document.getElementById('wchart');if(!s)return;
  const W=s.clientWidth,H=s.clientHeight;if(!W)return;
  const pts=S.weights.slice().sort((a,b)=>a.d<b.d?-1:1).slice(-90);
  if(pts.length<2){s.innerHTML=`<text x="${W/2}" y="${H/2}" text-anchor="middle" class="axt">Voeg minstens twee metingen toe voor een grafiek</text>`;return}
  const gk=+S.profile.goalkg||0;let mn=Math.min(...pts.map(p=>p.kg)),mx=Math.max(...pts.map(p=>p.kg));
  if(gk){mn=Math.min(mn,gk);mx=Math.max(mx,gk)}mn=Math.floor(mn-1);mx=Math.ceil(mx+1);
  const t0=Date.parse(pts[0].d),t1=Date.parse(pts[pts.length-1].d),L=38,Rr=12,T=12,B=26;
  const x=t=>L+(W-L-Rr)*(t-t0)/((t1-t0)||1),y=k=>T+(H-T-B)*(mx-k)/((mx-mn)||1);
  let g='';for(let i=0;i<=3;i++){const v=mn+(mx-mn)*i/3,yy=y(v);g+=`<line x1="${L}" x2="${W-Rr}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" class="axt">${Math.round(v)}</text>`}
  if(gk)g+=`<line x1="${L}" x2="${W-Rr}" y1="${y(gk)}" y2="${y(gk)}" stroke="var(--food)" stroke-dasharray="5 5"/><text x="${W-Rr}" y="${y(gk)-6}" text-anchor="end" class="axt">doel ${gk}</text>`;
  const d=pts.map((p,i)=>(i?'L':'M')+x(Date.parse(p.d)).toFixed(1)+' '+y(p.kg).toFixed(1)).join('');
  const f=d0=>{const dd=new Date(d0+'T12:00');return dd.getDate()+' '+MON[dd.getMonth()]};
  g+=`<path d="${d}" fill="none" stroke="var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`+pts.map(p=>`<circle cx="${x(Date.parse(p.d))}" cy="${y(p.kg)}" r="3.5" fill="var(--acc)"/>`).join('');
  g+=`<text x="${L}" y="${H-6}" class="axt">${f(pts[0].d)}</text><text x="${W-Rr}" y="${H-6}" text-anchor="end" class="axt">${f(pts[pts.length-1].d)}</text>`;
  s.innerHTML=g;
}

  sheet(`<h3>${esc(f.n)}</h3><p class="xs mut">Per 100 g: ${f.k} kcal · E ${f.p} · K ${f.c} · V ${f.f}</p><label class="f"><span>Hoeveelheid (gram)</span><input id="fg" inputmode="decimal" value="${g}" data-in="fg"></label>${f.pg?`<div class="chips">${[0.5,1,2,3].map(n=>`<button class="chip" data-a="fportion" data-g="${Math.round(f.pg*n)}">${String(n).replace('.',',')} ${esc(f.pn)}</button>`).join('')}</div>`:''}<label class="f"><span>Maaltijd</span><select id="fm">${MEALS.map((x,i)=>`<option value="${i}" ${i===+m?'selected':''}>${x}</option>`).join('')}</select></label><div class="card" id="fprev">${amountPrev(f,g)}</div><div class="g2">${editIdx!=null?'<button data-a="delfood">Verwijderen</button>':'<button data-a="backfood">Terug</button>'}<button class="grn" data-a="savefood">${editIdx!=null?'Opslaan':'Toevoegen'}</button></div>`);
}
const amountPrev=(f,g)=>{g=parseFloat(String(g).replace(',','.'))||0;return `<div class="row sp"><b>Totaal</b><b class="num">${R(f.k*g/100)} kcal</b></div><p class="xs mut" style="margin:4px 0 0">Eiwit ${Math.round(f.p*g/10)/10} g · Koolhydraten ${Math.round(f.c*g/10)/10} g · Vet ${Math.round(f.f*g/10)/10} g</p>`};

/* ---------- Etiket-foto, barcode en Open Food Facts ---------- */
const ICAM='<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>';
let SAMPLE=null,QR=null;
const IN_CLAUDE=!!(window.claude&&window.claude.use);
const CAN_SCAN=!IN_CLAUDE&&!!(navigator.mediaDevices&&navigator.mediaDevices.getUserMedia);
const r1=x=>{x=+x;return isFinite(x)?Math.round(x*10)/10:''};
function ownForm(v={},note='',bc=''){
  const val=x=>x===undefined||x===null||x===''?'':esc(String(x).replace('.',','));
  sheet(`<h3>Eigen product</h3><p class="xs mut">${esc(note||'Neem de waarden per 100 g over van het etiket.')}</p><label class="f"><span>Naam</span><input id="on" value="${esc(v.n||'')}" placeholder="bijv. Merk proteïnekwark"></label><div class="g2"><label class="f"><span>kcal per 100 g</span><input id="ok" inputmode="decimal" value="${val(v.k)}"></label><label class="f"><span>Eiwit (g)</span><input id="op" inputmode="decimal" value="${val(v.p)}"></label><label class="f"><span>Koolhydraten (g)</span><input id="oc" inputmode="decimal" value="${val(v.c)}"></label><label class="f"><span>Vet (g)</span><input id="of" inputmode="decimal" value="${val(v.f)}"></label><label class="f"><span>Portienaam</span><input id="opn" placeholder="bijv. bakje" value="${esc(v.pn||'')}"></label><label class="f"><span>Portie (g)</span><input id="opg" inputmode="decimal" value="${val(v.pg)}"></label></div><label class="f"><span>Barcode (optioneel)</span><input id="obc" inputmode="numeric" value="${esc(bc||v.bc||'')}"></label><button class="grn full" data-a="saveown">Opslaan</button>`);
}
const shrink=file=>new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const sc=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('De foto kon niet verwerkt worden.')),'image/jpeg',0.85)};img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('De foto kon niet geopend worden.'))};img.src=u});
const LABEL_PROMPT=`Je krijgt een foto van een voedingsmiddel: een voedingswaardetabel of verpakking (meestal Nederlands). Lees de voedingswaarden PER 100 GRAM (of per 100 ml) af. Staat alleen energie in kJ, reken om naar kcal (kJ / 4,184). Staan alleen waarden per portie, reken om naar per 100 g met de portiegrootte. Antwoord met uitsluitend JSON in deze vorm: {"naam": "merk en productnaam zoals op de verpakking, of een korte omschrijving", "kcal": getal, "eiwit": getal, "koolhydraten": getal, "vet": getal, "portienaam": "bijv. bakje, reep, portie of leeg", "portiegram": getal of null}. Kun je de tabel niet betrouwbaar lezen, antwoord dan {"fout": "korte uitleg in het Nederlands"}.`;
async function readLabel(file){
  if(!SAMPLE||!file)return;
  sheet(`<h3>Etiket lezen…</h3><p class="mut sm">Claude leest de voedingswaarden van je foto. Dit duurt een paar seconden.</p><div class="empty">Even geduld</div>`);
  try{
    const blob=await shrink(file);
    let v=await SAMPLE.json(LABEL_PROMPT,{images:[blob],modelTier:'default'});
    if(typeof v==='string')v=JSON.parse(v);
    if(!v||v.fout||!isFinite(+v.kcal))throw new Error((v&&v.fout)||'De voedingswaarden waren niet goed leesbaar.');
    ownForm({n:v.naam||'',k:r1(v.kcal),p:r1(v.eiwit),c:r1(v.koolhydraten),f:r1(v.vet),pn:v.portienaam||'',pg:v.portiegram?r1(v.portiegram):''},'Uitgelezen van je foto. Controleer de waarden met het etiket en sla op.');
  }catch(e){
    const m=e&&e.code==='rate_limited'?'Even te veel verzoeken. Probeer het over een minuut opnieuw.':(e&&e.message)||'Het etiket kon niet gelezen worden.';
    sheet(`<h3>Dat lukte niet</h3><p class="sm">${esc(m)}</p><p class="sm mut">Tip: fotografeer de voedingswaardetabel recht van voren, scherp en goed belicht.</p><div class="g2"><button data-a="labelpick">Nieuwe foto</button><button data-a="ownfood">Zelf invullen</button></div>`);
  }
}
const loadLib=()=>new Promise((res,rej)=>{if(window.Html5Qrcode)return res();const s=document.createElement('script');s.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';s.onload=()=>res();s.onerror=()=>rej(new Error('scanner kon niet laden'));document.head.appendChild(s)});
async function startScan(){
  sheet(`<h3>Scan barcode</h3><div id="reader" style="width:100%;min-height:240px;border-radius:14px;overflow:hidden;background:#000"></div><p class="xs mut" id="scanmsg" style="margin-top:8px">Richt je camera op de streepjescode.</p><div class="row"><input id="bcman" inputmode="numeric" placeholder="Of typ de barcode" aria-label="Barcode"><button data-a="bcgo">Zoek</button></div>`);
  try{
    await loadLib();if(!$('#reader'))return;
    const F=window.Html5QrcodeSupportedFormats;
    const q=new window.Html5Qrcode('reader',{formatsToSupport:[F.EAN_13,F.EAN_8,F.UPC_A,F.UPC_E],verbose:false});QR=q;
    await q.start({facingMode:'environment'},{fps:10,qrbox:(w,h)=>({width:Math.floor(Math.min(300,w*0.85)),height:Math.floor(Math.min(160,h*0.6))})},code=>{if(QR!==q)return;stopScan();lookup(code)},()=>{});
  }catch(e){const m=$('#scanmsg');if(m)m.textContent='Camera niet beschikbaar ('+((e&&e.message)||e)+'). Geef toegang tot de camera of typ de barcode hieronder.'}
}
function stopScan(){if(!QR)return;const q=QR;QR=null;try{q.stop().then(()=>q.clear()).catch(()=>{})}catch(e){}}
async function lookup(code){
  code=String(code||'').replace(/\D/g,'');if(code.length<8){toast('Dat is geen geldige barcode');return}
  const known=allFoods().find(f=>f.bc===code);if(known){amountSheet(known,known.pg||100,FS.m,null);return}
  if(IN_CLAUDE){ownForm({},'Nieuw product. Vul de waarden van het etiket in; de app onthoudt deze barcode.',code);return}
  sheet(`<h3>Product zoeken…</h3><p class="mut sm">Barcode ${esc(code)}</p>`);
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_nl,brands,nutriments,serving_quantity`);
    const j=await r.json(),p=j&&j.product,nu=(p&&p.nutriments)||{};
    let k=nu['energy-kcal_100g'];if((k===undefined||k==='')&&nu['energy_100g']!==undefined)k=nu['energy_100g']/4.184;
    if(!p||j.status!==1||k===undefined||k===''){ownForm({},'Dit product staat nog niet in Open Food Facts. Vul de waarden van het etiket in; de app onthoudt het bij de volgende scan.',code);return}
    const nm=[p.product_name_nl||p.product_name,(p.brands||'').split(',')[0]].filter(Boolean).join(' – ')||'Product '+code;
    const sq=+p.serving_quantity;
    ownForm({n:nm,k:Math.round(+k),p:r1(nu.proteins_100g),c:r1(nu.carbohydrates_100g),f:r1(nu.fat_100g),pn:sq?'portie':'',pg:sq?Math.round(sq):''},'Gevonden in Open Food Facts. Controleer de waarden met het etiket en sla op; daarna herkent de app deze barcode direct.',code);
  }catch(e){ownForm({},'Geen verbinding met de productdatabase. Vul de waarden zelf in.',code)}
}

    const old=S.plans.find(x=>x.id===S.active);
    if(first||!old||old.auto){if(old&&old.auto)S.plans=S.plans.filter(x=>x.id!==old.id);genPlan()}
    genMealPlan();save('main');toast(first?'Je schema\'s zijn klaar':'Profiel en schema\'s bijgewerkt');go('vandaag')},
  export:async()=>{try{await navigator.clipboard.writeText(JSON.stringify(S));toast('Back-up gekopieerd')}catch(e){sheet(`<h3>Back-up</h3><p class="xs mut">Selecteer en kopieer deze tekst.</p><textarea readonly>${esc(JSON.stringify(S))}</textarea>`)}},
  import:()=>sheet(`<h3>Back-up terugzetten</h3><p class="xs mut">Plak hier je back-up. Je huidige gegevens worden vervangen.</p><textarea id="imp"></textarea><button class="pri full" style="margin-top:10px" data-a="doimport">Terugzetten</button>`),
  doimport:()=>{try{const d=JSON.parse($('#imp').value);if(!d||!d.profile)throw 0;S={...S,...d,profile:{...DEF_PROFILE,...d.profile}};save('main');Object.keys(S.days).forEach(saveDay);closeSheet();render();toast('Back-up teruggezet')}catch(e){toast('Dit is geen geldige back-up')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
let kgT;
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='libq'){V.libQ=el.value;$('#liblist').innerHTML=libList(V.libQ,V.libG,'exinfo')}
  else if(k==='pickq'){$('#picklist').innerHTML=libList(el.value,'','pickex',`data-di="${el.dataset.di}"`)}
  else if(k==='fq'){$('#flist').innerHTML=foodList(el.value)}
  else if(k==='fg'){$('#fprev').innerHTML=amountPrev(FS.sel,el.value)}
  else if(k==='kg'){const date=el.dataset.d,w=todaysWorkout(date);if(!w||w.idx<0)return;const d=day(date);if(!d.wk||d.wk.plan!==w.plan.id||d.wk.pi!==w.idx)d.wk={plan:w.plan.id,pi:w.idx,sets:{},kg:{},done:false};d.wk.kg[el.dataset.i]=el.value;clearTimeout(kgT);kgT=setTimeout(()=>saveDay(date),800)}
  else if(k==='pf'&&el.tagName==='INPUT'){const kk=el.dataset.k;S.profile[kk]=kk==='name'?el.value:(el.value===''?'':num(el.value)||'');const c=$('#calc');if(c)c.innerHTML=calcHtml();save('main')}
  else if(k==='xm'){const x=$('#xk');if(x)x.value=extKcal($('#xt').value,num(el.value)||0)}
  else if(k==='plname'){const pl=S.plans.find(x=>x.id===V.edit);pl.name=el.value;save('main')}
  else if(k==='dname'){S.plans.find(x=>x.id===V.edit).days[+el.dataset.di].name=el.value;save('main')}
  else if(k==='exf'){const x=S.plans.find(p=>p.id===V.edit).days[+el.dataset.di].ex[+el.dataset.i];x[el.dataset.k]=el.dataset.k==='reps'?el.value:(parseInt(el.value)||0);save('main')}
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.in==='pf'){const k=el.dataset.k;let v=el.value;if(['act','days'].includes(k))v=+v;else if(['age','cm','kg','goalkg'].includes(k))v=v===''?'':num(v)||'';S.profile[k]=v;save('main');const c=$('#calc');if(c)c.innerHTML=calcHtml()}
  else if(el.dataset.in==='exf'||el.dataset.in==='plname'||el.dataset.in==='dname')render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
const fromHash=()=>{const h=location.hash.slice(1);if(['vandaag','training','voeding','voortgang','profiel'].includes(h)&&h!==V.tab){V.tab=h;V.edit=null;render()}};
window.addEventListener('hashchange',fromHash);
const h0=location.hash.slice(1);if(['vandaag','training','voeding','voortgang','profiel'].includes(h0))V.tab=h0;
$('#labelIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readLabel(f)});
(async()=>{try{if(!IN_CLAUDE)return;const s=await window.claude.use('sample');if(!s)return;let ok=true;try{const l=s.limits?await s.limits():null;if(l&&l.images===false)ok=false}catch(e){}if(ok)SAMPLE=s}catch(e){}})();
try{const qp=new URLSearchParams(location.search);if(qp.get('log')){addExt(qp.get('log').slice(0,40),num(qp.get('min'))||7,num(qp.get('kcal')));history.replaceState(null,'',location.pathname+'#vandaag');V.tab='vandaag';setTimeout(()=>toast(qp.get('log')+'-training toegevoegd'),300)}}catch(e){}
setSync('local');render();initDb();
}
</script>
</body>
</html>
