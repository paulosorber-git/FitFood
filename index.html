<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Fit & Food">
<meta name="theme-color" content="#ff5a2c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fit &amp; Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a shipped coaching app, direct and encouraging, like a good trainer.
   IDEA: the gym logbook + the kitchen scale — every set ticked, every gram counted.
   PICTURE: today's calorie ring and today's workout card are the first screen.
   COLOUR and TYPE: white or near-black ground, ink, one hot orange for training, one green for food; Archivo throughout.
   LAYOUT: single phone column, bottom tab bar, sheets that slide up for detail. */
:root{color-scheme:light dark;
--bg:light-dark(#ffffff,#0e1013);--card:light-dark(#f3f4f6,#1a1d22);--card2:light-dark(#e9ebef,#23272d);
--ink:light-dark(#121418,#f2f3f5);--mut:light-dark(#5b616c,#9ca3ae);--line:light-dark(#e2e4e8,#2b2f36);
--acc:#ff5a2c;--accd:light-dark(#d9431a,#ff7a52);--food:light-dark(#178a5e,#2fc488);
--p:#3b6cf6;--c:#f0a412;--f:#a35bd6;--warn:light-dark(#b54708,#f5a524)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Archivo,system-ui,-apple-system,sans-serif;overflow-x:clip;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.top b{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sync{font-size:13px;color:var(--mut)}
h1{font-size:32px;line-height:1.05;margin:18px 0 4px;font-weight:800;letter-spacing:-.02em;text-wrap:balance}
h2{font-size:20px;margin:26px 0 10px;font-weight:700}
h3{font-size:17px;margin:0 0 4px;font-weight:700}
p{margin:0 0 10px}
.mut{color:var(--mut)}.sm{font-size:14px}.xs{font-size:13px}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;gap:10px}.sp{justify-content:space-between}.wrapr{flex-wrap:wrap}
.grow{flex:1}
button,.btn{font:inherit;font-weight:600;border:0;border-radius:12px;min-height:44px;padding:10px 16px;background:var(--card2);color:var(--ink);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--accd);outline-offset:2px}
.pri{background:var(--acc);color:#fff}.grn{background:var(--food);color:#fff}
.ghost{background:transparent;padding:10px 8px;color:var(--accd)}
.full{width:100%}
.ico{width:20px;height:20px;flex:none}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;min-height:44px;padding:9px 12px;width:100%}
textarea{min-height:110px}
label.f{display:block;margin:10px 0}label.f>span{display:block;font-size:14px;color:var(--mut);margin-bottom:4px}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:7px 14px;border-radius:999px;background:var(--card);font-size:15px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin:14px 0}
.seg button{flex:1;background:transparent;min-height:40px;border-radius:10px}
.seg button.on{background:var(--bg);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:0 4px}
.tabs button{flex-direction:column;gap:2px;background:transparent;font-size:12px;font-weight:600;color:var(--mut);min-height:62px;padding:6px 0;border-radius:0}
.tabs button svg{width:24px;height:24px}
.tabs button.on{color:var(--acc)}.tabs button.on.fd{color:var(--food)}
/* hero */
.hero{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center}
.ringw{position:relative;width:150px;height:150px}
.ring{width:150px;height:150px}.rbg{fill:none;stroke:var(--card2);stroke-width:14}.rfg{fill:none;stroke-width:14;stroke-linecap:round;transition:stroke-dasharray .6s}
.ringt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ringt b{font-size:30px;font-weight:800;line-height:1}.ringt span{font-size:13px;color:var(--mut)}
.mac{margin:6px 0}.mac .row{font-size:14px}.mac b{font-weight:700}
.bar{height:8px;background:var(--card2);border-radius:9px;overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:9px}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
/* workout */
.wk{border-radius:18px;padding:16px;margin:12px 0;background:var(--acc);color:#fff}
.wk .mut{color:rgb(255 255 255/.85)}
.wk h3{font-size:22px}
.exr{background:var(--card);border-radius:16px;padding:12px 14px;margin:8px 0}
.exr .nm{font-weight:700;background:none;padding:0;min-height:auto;text-align:left;justify-content:flex-start;color:var(--ink)}
.sets{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.dot{width:44px;height:44px;border-radius:50%;padding:0;background:var(--bg);border:2px solid var(--line);font-size:15px}
.dot.on{background:var(--acc);border-color:var(--acc);color:#fff}
.kg{width:92px;min-height:44px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.badge.w{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.ok{background:color-mix(in srgb,var(--food) 18%,transparent);color:var(--food)}
.gl{width:38px;height:38px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--card2);color:var(--accd)}
.gl svg{width:22px;height:22px}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);background:none;border-radius:0;width:100%;text-align:left;min-height:56px;font-weight:500}
.li:last-child{border-bottom:0}
.li .t{flex:1}.li .t b{display:block;font-weight:600}.li .t small{color:var(--mut);font-size:13px}
.meal h3{display:flex;justify-content:space-between}
.meal .li{padding:9px 0}
/* sheet */
.sheetbg{position:fixed;inset:0;background:rgb(0 0 0/.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:92vh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-width:600px;margin:0 auto;animation:up .25s ease-out}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 10px}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.rfg{transition:none}}
.demo{border-radius:18px;overflow:hidden;background:linear-gradient(var(--card),var(--card2));margin:12px 0;padding:6px 6px 0}
.demo svg{display:block;width:100%;height:auto}
.fth{display:inline-block;background:var(--card2);overflow:hidden}.fth svg{width:100%;height:100%;display:block}
.strip .fth{width:40px;height:40px;border-radius:9px}
.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.demo img.b{animation:flip 2.4s steps(1) infinite}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.demo .lbl{position:absolute;left:10px;bottom:10px;background:rgb(0 0 0/.6);color:#fff;font-size:12px;font-weight:600;padding:3px 8px;border-radius:8px}
.th{width:44px;height:44px;flex:none;border-radius:11px;object-fit:cover;background:var(--card2)}

.shd{position:sticky;top:-8px;z-index:3;background:var(--bg);margin:-8px -16px 4px;padding:8px 16px 2px;display:flex;justify-content:center}
.shd .x{position:absolute;right:10px;top:8px;width:40px;height:40px;min-height:40px;padding:0;border-radius:50%;font-size:18px}
.bm{width:100%;max-width:340px;height:auto;display:block;margin:4px auto 0}
.bm .sil{fill:var(--line)}.bm .m0{fill:color-mix(in srgb,var(--ink) 9%,var(--card))}.bm .m1{fill:color-mix(in srgb,var(--acc) 45%,var(--card))}.bm .m2{fill:var(--acc)}
.bm .j1{fill:#f0a412}.bm .j2{fill:#e5484d}.bm .jr{fill:none;stroke:#e5484d;stroke-width:2}.bm .jo{stroke:var(--bg);stroke-width:1.5}
.bm text{fill:var(--mut);font-size:9px;font-weight:600}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut);justify-content:center;margin:6px 0 2px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mc{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;margin:4px 4px 0 0;white-space:nowrap}
.mc.p{background:var(--acc);color:#fff}.mc.s{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--accd)}
.jc{display:inline-block;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;margin:4px 4px 0 0;white-space:nowrap}
.jc.l1{background:color-mix(in srgb,#f0a412 20%,transparent);color:light-dark(#9a6200,#f5b544)}.jc.l2{background:color-mix(in srgb,#e5484d 18%,transparent);color:light-dark(#b42318,#ff7a7e)}.jc.l0{background:color-mix(in srgb,var(--food) 16%,transparent);color:var(--food)}
.jc.hurt{outline:2px solid #e5484d}
.th.lg{width:68px;height:68px;border-radius:14px}
.exe{background:var(--bg);border-radius:16px;padding:12px;margin:10px 0;border:1px solid var(--line)}
.exe .nm{font-weight:700;background:none;padding:0;min-height:auto;text-align:left;justify-content:flex-start;color:var(--ink);font-size:17px}
.tagl{font-size:12px;color:var(--mut);margin-right:2px;font-weight:600}
.exe.warn{border-color:#e5484d}
.ctl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:end;margin-top:10px}
.ctl label{font-size:12px;color:var(--mut)}.ctl input,.ctl select{min-height:40px;padding:6px 8px}
.progb{background:var(--card);border-radius:16px;padding:12px 14px;margin:10px 0}.progb.sm{padding:10px 12px;margin:8px 0 4px;background:var(--card2)}.progb .badge{background:var(--acc);color:#fff}.pbar{display:flex;gap:4px;margin-top:8px}.pbar i{height:6px;border-radius:3px;background:var(--line)}.pbar i.d{background:var(--accd)}.pbar i.c{background:var(--acc)}
.qtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px;margin-top:12px}
.qt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 6px;border-radius:18px;background:color-mix(in srgb,var(--qc) 14%,var(--card2));min-height:92px;text-align:center}
.qt .qi{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--qc);color:#fff;margin-bottom:4px}.qt .qi .ico{width:22px;height:22px}
.qt b{font-size:14px}.qt small{font-size:11px;color:var(--mut)}
.mpwait{position:relative;border-radius:18px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:10px 0}.mpwait img{width:100%;height:100%;object-fit:cover;opacity:.85}
.scanline{position:absolute;left:0;right:0;height:3px;background:linear-gradient(90deg,transparent,#fff,transparent);box-shadow:0 0 18px #fff;animation:scan 1.6s ease-in-out infinite alternate}
@keyframes scan{from{top:6%}to{top:92%}}
.mphead{display:flex;gap:12px;align-items:center}.mphead img{width:64px;height:64px;border-radius:14px;object-fit:cover}
.mptot{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:6px;background:var(--card2);border-radius:16px;padding:12px;margin:12px 0 6px;text-align:center}.mptot small{display:block;color:var(--mut);font-size:11px}
.mpi{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.mpi .t{flex:1;min-width:0}.mpi .t b{display:block;font-size:15px}.mpi .t small{color:var(--mut);font-size:12px}
.mpi.off{opacity:.45}.mpx{width:34px;min-height:34px;padding:0;color:var(--food);font-weight:800}
.mpg{display:flex;align-items:center;gap:2px}.mpg button{width:32px;min-height:36px;padding:0;border-radius:10px}.mpg input{width:52px;min-height:36px;text-align:center;padding:4px;font-weight:700}
.li.sel{background:color-mix(in srgb,var(--food) 12%,transparent);border-radius:14px}
.selc{flex:none;width:24px;height:24px;border-radius:50%;border:2px solid var(--food);display:grid;place-items:center;font-size:14px;font-weight:800;color:#fff}.li.sel .selc{background:var(--food)}
.selbar{position:fixed;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:7;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);max-width:560px;margin:0 auto}
.selbar button[disabled]{opacity:.4}
.mvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.mvgrid .big{min-height:64px}
.mvchips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mvchips .chip{justify-content:center;padding:8px 2px;font-size:13px}
.pinadd{flex:none;min-height:44px;padding:0 12px;border-radius:12px;font-weight:700;font-size:14px;white-space:nowrap}
.rpc{margin-top:8px}.rpc .seg{margin:0 0 8px}.rpc .seg button{min-height:34px;font-size:14px}
.rpi{display:flex;align-items:center;gap:8px}.rpi input{width:76px;min-height:44px;text-align:center;font-size:17px;font-weight:700;padding:6px}.rpi select{min-height:44px;width:auto;padding:6px 10px}.rpi span{color:var(--mut);font-size:14px}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;overflow:hidden;height:40px;background:var(--bg)}
.step button{min-height:38px;width:38px;padding:0;border-radius:0;background:var(--card2);font-size:18px}.step b{width:30px;text-align:center}
.strip{display:flex;gap:4px;margin-top:6px;overflow:hidden}.strip img{width:38px;height:38px;flex:none;border-radius:9px;object-fit:cover;background:var(--card2)}
.dsum{background:var(--bg);border-radius:16px;padding:10px 12px;margin:12px 0}
.jl{display:grid;grid-template-columns:118px minmax(0,1fr) 54px;gap:8px;align-items:center;font-size:13px;margin:5px 0}
.jl .bar{height:10px;margin:0}
.wkg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{flex-direction:column;gap:0;padding:8px 0;min-height:60px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.wd b{font-size:16px}.wd small{font-size:11px;color:var(--mut);font-weight:600}
.wd.thuis{background:var(--food);border-color:var(--food);color:#fff}.wd.thuis small{color:rgb(255 255 255/.9)}
.wd.gym{background:var(--acc);border-color:var(--acc);color:#fff}.wd.gym small{color:rgb(255 255 255/.9)}
.locb{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;color:#fff;background:var(--acc)}.locb.thuis{background:var(--food)}
.exl{display:flex;align-items:center;gap:12px;width:100%;padding:8px 0;background:none;border-radius:0;text-align:left;min-height:64px;font-weight:500}
.exl .th{width:52px;height:52px}.exl .t{flex:1}.exl .t b{display:block;font-weight:700}.exl .t small{color:var(--mut);font-size:13px}
.exw{border-top:1px solid var(--line)}.exw.open{background:var(--bg);border-radius:14px;border-top:0;padding:0 10px 10px;margin:6px -6px}
.rdot{width:9px;height:9px;border-radius:50%;background:#e5484d;flex:none}
details.more{margin:10px 0 4px}details.more summary{cursor:pointer;font-weight:600;color:var(--accd);font-size:15px;min-height:36px;display:flex;align-items:center}
.note{font-size:14px;font-weight:600;margin:10px 0 0}.note.bad{color:#e5484d}.note.ok{color:var(--food)}
.acts{display:grid;grid-template-columns:44px 44px minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;margin-top:8px}.acts button{min-height:42px;padding:6px}
.card .seg{background:var(--card2)}
.startb{width:100%;margin-top:12px;background:#fff;color:var(--acc);font-size:17px;min-height:50px;border-radius:14px}
.sheetbg{z-index:45!important}.sheet{z-index:46!important}.toast{z-index:60!important}
.player{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;padding:calc(10px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))}
.player .in{max-width:520px;margin:0 auto}
.pl-top{display:flex;align-items:center;gap:10px}.pl-top .bar{height:6px}
.pl-fig{background:linear-gradient(var(--card),var(--card2));border-radius:22px;margin:12px 0 6px;padding:8px 8px 0}.pl-fig svg{display:block;width:100%;height:auto;max-height:38vh}
.pl-name{font-size:26px;margin:10px 0 2px;line-height:1.1}
.cnt{display:block;margin:14px auto 6px;width:150px;height:150px;border-radius:50%;background:var(--card);border:6px solid var(--acc);font-size:56px;font-weight:800;color:var(--ink);font-variant-numeric:tabular-nums}
.cnt small{display:block;font-size:13px;font-weight:600;color:var(--mut)}
.tring{position:relative;width:190px;height:190px;margin:12px auto 6px}.tring svg{width:100%;height:100%;transform:rotate(-90deg)}
.tring .tt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.tring b{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.tring span{font-size:14px;color:var(--mut);font-weight:600}
.pl-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.big{min-height:56px;font-size:18px;border-radius:16px}
.nextc{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:16px;padding:10px 12px;margin-top:16px}.nextc .fth{width:64px;height:52px;border-radius:12px}
:root{--fib:light-dark(#f1efea,#2a2d33)}
.fi{flex:none;display:inline-block;vertical-align:middle}
.istack{display:inline-flex;flex:none}.istack .fi{border-radius:50%;box-shadow:0 0 0 2px var(--card)}.istack .fi+.fi{margin-left:-12px}
.mpc{padding:14px}.mpc h3{font-size:17px}.mbar{display:flex;height:6px;border-radius:6px;overflow:hidden;margin:12px 0 8px;background:var(--card2)}
.mpi{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}.mpi:first-child{border-top:0}
.fxr{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}.fxr input{width:72px;min-height:40px;padding:6px 8px;text-align:right}.fxr button{min-height:40px;width:40px;padding:0}
.fxq{display:flex;gap:8px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}.fxchip{flex:none;flex-direction:column;align-items:flex-start;gap:6px;background:color-mix(in srgb,var(--food) 10%,var(--card));border-radius:14px;padding:10px 12px;min-width:140px;font-size:14px}

.pl-fig.vdemo .exv{max-height:42vh;object-fit:contain}
.vb{color:var(--accd);font-weight:600}
.steps{padding-left:22px;margin:8px 0}.steps li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;font-size:15px;max-width:90vw}
.fig{position:relative;min-height:220px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.axt{fill:var(--mut);font-size:12px}
.wbar{display:grid;grid-template-columns:34px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.wbar .bar{height:14px;margin:0}
.empty{text-align:center;padding:26px 10px;color:var(--mut)}
.water{display:flex;gap:6px;flex-wrap:wrap}
.drops{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.water button{width:36px;height:44px;min-height:44px;padding:0;border-radius:8px;background:var(--card2)}
.water button.on{background:var(--p)}
.ed{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px;gap:6px;align-items:center}
.ed input{min-height:40px;padding:6px 8px}
.tool{display:flex;gap:4px}.tool button{min-height:40px;padding:6px 10px}
@media(max-width:400px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero .mac{width:100%;text-align:left}h1{font-size:28px}}

<script>
{

// id, naam, engelse zoekterm, groep, materiaal, belaste gewrichten, stappen, tip
const EXR_RAW=[
['bw_squat','Squat (lichaamsgewicht)','bodyweight squat','benen','geen','knie,heup','Voeten op heupbreedte, tenen licht naar buiten.|Zak met je billen naar achter en omlaag alsof je gaat zitten.|Houd je knieën in lijn met je tenen en je borst omhoog.|Duw via je hielen terug omhoog.','Ga zo diep als je kunt zonder dat je onderrug bol trekt.'],
['goblet','Goblet squat','goblet squat','benen','dumbbell','knie','Houd een dumbbell verticaal tegen je borst.|Zak recht omlaag tussen je knieën, ellebogen langs de binnenkant van je knieën.|Houd je hielen aan de grond.|Kom krachtig omhoog en span je billen aan.','Het gewicht vóór je helpt je rechtop te blijven: ideaal om squatten te leren.'],
['bb_squat','Barbell squat','barbell back squat','benen','barbell','knie,onderrug,heup','Leg de stang op je bovenrug, niet op je nek.|Adem in, span je buik aan en zak gecontroleerd tot je dijen minstens horizontaal zijn.|Knieën naar buiten duwen, rug neutraal.|Duw omhoog en adem uit bovenin.','Gebruik de veiligheidssteunen in het rek.'],
['legpress','Leg press','leg press machine','benen','machine','knie','Ga met je rug en billen plat tegen het kussen zitten.|Voeten op heupbreedte midden op het platform.|Laat het platform zakken tot je knieën ongeveer 90 graden zijn.|Duw terug zonder je knieën op slot te zetten.','Laat je billen niet van het kussen komen onderin.'],
['lunge','Lunges','forward lunge','benen','geen','knie,heup','Sta rechtop, handen op je heupen.|Stap een grote stap naar voren.|Zak tot beide knieën ongeveer 90 graden zijn; achterste knie net boven de grond.|Duw je terug naar de start en wissel van been.','Voorste knie blijft boven je enkel, niet ver voorbij je tenen.'],
['bulgarian','Bulgarian split squat','bulgarian split squat','benen','dumbbell','knie,heup','Leg je achterste voet op een bank.|Houd in elke hand een dumbbell.|Zak recht omlaag op je voorste been.|Duw via je voorste hiel omhoog. Doe alle herhalingen en wissel.','Licht voorover leunen legt meer nadruk op je billen.'],
['stepup','Step-up','dumbbell step up','benen','dumbbell','knie','Sta voor een stevige bank of trede.|Zet je hele voet op de bank.|Stap omhoog door je voorste been te strekken, niet afzetten met het achterste.|Stap gecontroleerd terug.','Kies een lagere trede als je knie gevoelig is.'],

['rdl','Roemeense deadlift','romanian deadlift dumbbell','benen','dumbbell','onderrug','Sta met dumbbells voor je dijen, knieën licht gebogen.|Duw je heupen naar achter en laat de gewichten langs je benen zakken.|Houd je rug recht tot je rek voelt in je hamstrings.|Kom omhoog door je heupen naar voren te duwen.','Het is een heupbeweging, geen buiging uit je rug.'],
['deadlift','Deadlift','barbell deadlift','benen','barbell','onderrug,heup','Stang boven je middenvoet, voeten op heupbreedte.|Pak de stang net buiten je knieën, rug recht, borst vooruit.|Duw de vloer weg en strek knieën en heupen tegelijk.|Laat gecontroleerd zakken langs je benen.','Houd de stang dicht tegen je lichaam.'],
['legcurl','Leg curl','lying leg curl machine','benen','machine','','Lig op je buik, kussen net boven je hielen.|Buig je knieën en trek het kussen richting je billen.|Laat langzaam terugzakken.','Houd je heupen op het kussen.'],
['legext','Leg extension','leg extension machine','benen','machine','knie','Ga zitten met het kussen op je scheenbenen.|Strek je benen volledig.|Laat langzaam zakken.','Gebruik een licht gewicht en beweeg gecontroleerd.'],
['calf','Kuitheffen','standing calf raise','benen','geen','enkel','Sta met je voorvoeten op een trede.|Kom zo hoog mogelijk op je tenen.|Zak langzaam tot onder de trede.','Pauzeer een tel bovenin.'],
['glutebridge','Glute bridge','glute bridge','billen','geen','','Lig op je rug, knieën gebogen, voeten plat.|Duw je heupen omhoog tot een rechte lijn van knie tot schouder.|Knijp je billen een tel aan bovenin.|Zak gecontroleerd.','Duw via je hielen, niet via je tenen.'],
['hipthrust','Hip thrust','barbell hip thrust','billen','barbell','','Zit met je bovenrug tegen een bank, stang over je heupen (met kussen).|Voeten plat, op heupbreedte.|Duw je heupen omhoog tot je romp horizontaal is.|Zak gecontroleerd.','Kin licht ingetrokken, kijk naar voren.'],

['cablefly','Cable fly','cable chest fly','borst','kabel','schouder','Sta tussen twee kabels, handvatten op schouderhoogte.|Armen licht gebogen.|Breng je handen in een boog voor je borst samen.|Laat langzaam terugkomen.','Voel de rek, maar ga niet verder dan prettig.'],
['pullup','Pull-up','pull up','rug','stang','schouder,elleboog','Hang aan de stang, handen iets breder dan schouders.|Trek je schouderbladen omlaag.|Trek jezelf op tot je kin boven de stang.|Zak gecontroleerd.','Gebruik een band of assistmachine als het nog niet lukt.'],
['latpull','Lat pulldown','lat pulldown','rug','machine','schouder','Ga zitten, knieën onder het kussen.|Pak de stang breed vast.|Trek de stang naar je bovenste borst, ellebogen naar beneden.|Laat langzaam terug.','Niet achter je nek trekken.'],

['bbrow','Barbell row','barbell bent over row','rug','barbell','onderrug','Buig voorover vanuit je heupen, rug recht.|Pak de stang op schouderbreedte.|Trek de stang naar je navel.|Laat gecontroleerd zakken.','Houd je rug neutraal, anders lichter.'],

['dbshoulder','Schouderpress (dumbbell of kettlebell)','dumbbell shoulder press','schouders','dumbbell','schouder','Zit rechtop met dumbbells op schouderhoogte.|Druk ze omhoog tot je armen bijna gestrekt zijn.|Laat langzaam zakken.','Zittend met rugleuning spaart je onderrug.'],
['lateral','Lateral raise','dumbbell lateral raise','schouders','dumbbell','schouder','Sta met lichte dumbbells langs je zij.|Til je armen zijwaarts tot schouderhoogte, ellebogen licht gebogen.|Laat langzaam zakken.','Licht gewicht, strakke techniek.'],
['reardelt','Reverse fly','dumbbell reverse fly','schouders','dumbbell','','Buig voorover, rug recht.|Til lichte dumbbells zijwaarts op.|Knijp je schouderbladen samen en zak langzaam.','Traint de achterkant van je schouders.'],
['curl','Biceps curl','dumbbell bicep curl','armen','dumbbell','elleboog','Sta met dumbbells langs je zij, handpalmen naar voren.|Buig je ellebogen en krul de gewichten omhoog.|Laat langzaam zakken.','Ellebogen blijven naast je lichaam.'],

  const wds=[1,2,3,4,5,6,0].filter(w=>sched[w]);
  if(!wds.length){toast('Kies eerst je trainingsdagen in je profiel');return null}
  const n=Math.min(6,wds.length);
  const pick=(list,used,loc,avoid)=>{
    const c=list.map(id=>EX[id]).filter(e=>e&&canDo(e,loc)&&!conflicts(e).length&&!used.includes(e.id));
    const order=e=>injScore(e)*10+(p.lvl==='beginner'&&e.eq==='barbell'?1:0)+(VID[e.id]?0:0.5)+(avoid&&avoid.has(e.id)?3:0);
    return c.map((e,i)=>({e,k:order(e)*100+i})).sort((a,b)=>a.k-b.k)[0]?.e;
  };
  const strength=(key,loc,goal)=>{const [nm,slots]=DT[key];const used=[],ex=[];
    slots.forEach(sl=>{const e=pick(SLOTS[sl],used,loc);if(e){used.push(e.id);ex.push({id:e.id,...scheme(e.id,goal)})}});return {nm,ex,used}};
  let days;
  if(kind==='afvallen'){
    const L={1:['HA'],2:['HA','KA'],3:['HA','KA','HB'],4:['HA','KA','CD','HB'],5:['HA','KA','CD','HB','KB'],6:['HA','KA','CD','HB','KB','CD']}[n];const hiUsed=new Set();
    days=wds.slice(0,n).map((wd,i)=>{const t=L[i],loc=sched[wd];
      if(t==='HA'||t==='HB'){const used=[],ex=[];
        (t==='HA'?['CARD','LEG','PUSH','CARD','CORE','POST']:['CARD','POST','LEG','CARD','PUSH','CORE']).forEach(sl=>{const e=pick(HI[sl],used,loc,hiUsed);if(e){used.push(e.id);hiUsed.add(e.id);ex.push({id:e.id,sets:3,reps:'30 sec',rest:30})}});
        return {name:t==='HA'?'HIIT-circuit A':'HIIT-circuit B',wd:[wd],loc,kind:'hiit',circuit:{rounds:3,rest:60},ex}}
      if(t==='CD'){const used=[],ex=[];const c=pick(CARDIO_LONG,used,loc);if(c){used.push(c.id);ex.push({id:c.id,sets:1,reps:'30 min',rest:0})}
        ['plank','deadbug','birddog','sideplank'].forEach(id=>{if(ex.length>=3)return;const e=pick([id],used,loc);if(e){used.push(e.id);ex.push({id:e.id,...scheme(e.id,'afvallen')})}});
        return {name:'Cardio (rustig tempo)',wd:[wd],loc,kind:'cardio',ex}}
      const r=strength(t==='KA'?'FA':'FB',loc,'afvallen');const c=pick(['bike','row','jumprope','running','treadrun','walk'],r.used,loc);if(c)r.ex.push({id:c.id,sets:1,reps:'10 min',rest:0});
      return {name:'Kracht + cardio '+(t==='KA'?'A':'B'),wd:[wd],loc,ex:r.ex}});
  }else{
    const T={1:['FA'],2:['FA','FB'],3:['FA','FB','FC'],4:['UA','LA','UB','LB'],5:['PU','PL','LG','UA','LB'],6:['PU','PL','LG','UA','LA','UB']}[n];
    days=wds.slice(0,n).map((wd,i)=>{const loc=sched[wd],r=strength(T[i],loc,kind==='spier'?'spier':p.goal);
      if(kind==='basis'&&(p.goal==='afvallen'||p.goal==='fit')){const c=pick(SLOTS.CARDIO,r.used,loc);if(c)r.ex.push({id:c.id,...scheme(c.id,p.goal)})}
      return {name:r.nm,wd:[wd],loc,ex:r.ex}});
  }
  const goalN={afvallen:'Afvallen',spier:'Spieropbouw',behoud:'Fit blijven',fit:'Conditie'}[p.goal]||'Training';
  const plan={id:uid(),name:kind==='basis'?`${goalN} · ${n}× per week`:PROG[kind].title,days,auto:1};
  if(kind!=='basis'){plan.prog={type:kind,start:today()};applyProg(plan)}
  S.plans.push(plan);S.active=plan.id;save('main');return plan;
}
const activePlan=()=>S.plans.find(x=>x.id===S.active)||null;
function todaysWorkout(date){
  const plan=activePlan();if(!plan||!plan.days.length)return null;
  const d=peekDay(date);
  let idx=d.wk&&d.wk.plan===plan.id&&d.wk.pi!=null?d.wk.pi:plan.days.findIndex(x=>(x.wd||[]).includes(wdOf(date)));
  return idx<0||!plan.days[idx]?{plan,idx:-1}:{plan,idx,dd:plan.days[idx]};
}

/* ---------- Voedingsschema-generator ---------- */
function topUp(meals,t,ds){
  const st=()=>{let k=0,p=0,kf=0;meals.forEach(ml=>ml.it.forEach(([n,g])=>{const f=findFood(n);if(f){k+=f.k*g/100;p+=f.p*g/100;if(ml.fx)kf+=f.k*g/100}}));return {k,p,kf}};
  let a=st();const free=meals.filter(m=>!m.fx);if(!free.length)return;
  if(ds!=='keto'&&t.p-a.p>20){const KW=findFood('Magere kwark'),tg=free.find(m=>m.m===3)||free[free.length-1];
    const g=Math.min(500,Math.round((t.p-a.p)/(KW.p/100)/50)*50);if(g>=100){tg.it.push(['Magere kwark',g]);if(!/kwark/i.test(tg.n))tg.n+=' + kwark'}}
  a=st();const f=(t.kcal-a.kf)/Math.max(1,a.k-a.kf);
  if(f>0.6&&f<1.6&&Math.abs(f-1)>0.02)free.forEach(ml=>{ml.it=ml.it.map(([n,g])=>[n,Math.max(5,Math.round(g*f/5)*5)])});
}
function genMealPlan(){
  const t=targets(),veg=S.profile.diet==='veg',ds=S.profile.dstyle||'bal',skip=ds==='if168'?[0]:[];
  const split=ds==='if168'?[0,.4,.45,.15]:t.kcal>2600?[.25,.3,.3,.15]:[.25,.3,.35,.1];
  const prev=[],days=[],bonus=[];
  for(let d=0;d<7;d++){
    const meals=[],wd=(d+1)%7,fxm={};
    (S.fixed||[]).forEach(f=>{if((f.days||[]).includes(wd)&&fxm[f.m]===undefined)fxm[f.m]=f});
    skip.forEach(m=>delete fxm[m]);
    const td=addBonus(t,wdBonus(wd));
    const fxK=Object.values(fxm).reduce((a,f)=>a+sumFood(fxItems(f)).k,0),freeSplit=[0,1,2,3].filter(m=>!fxm[m]).reduce((a,m)=>a+split[m],0)||1,kcalFree=Math.max(0,td.kcal-fxK);
    for(let m=0;m<4;m++){
      if(skip.includes(m))continue;
      if(fxm[m]){meals.push({m,n:fxm[m].n,fx:1,it:fxm[m].it.map(x=>[x.n,x.g])});continue}
      const base0=MT[m].filter(x=>!veg||x.v);let opts=base0.filter(x=>dietOk(x,ds));
      if(!opts.length&&ds==='keto')opts=base0.filter(x=>dietOk(x,'lowcarb'));if(!opts.length)opts=base0;
      const cand=opts.filter(x=>x.n!==prev[m]);
      const pk=cand[Math.floor(Math.random()*cand.length)]||opts[0];prev[m]=pk.n;
      const base=pk.it.reduce((s,[n,g])=>s+(findFood(n)?.k||0)*g/100,0)||1;
      const sc=Math.max(.5,Math.min(ds==='if168'?2.8:2.2,kcalFree*split[m]/freeSplit/base));
      meals.push({m,n:pk.n,it:pk.it.map(([n,g])=>[n,Math.max(5,Math.round(g*sc/5)*5)])});
    }
    topUp(meals,td,ds);bonus.push(td.bonus||0);days.push(meals);
  }
  S.mealPlan={made:today(),kcal:t.kcal,diet:ds,goal:ngoal(),days,bonus};save('main');
}
const mealItems=meal=>meal.it.map(([n,g])=>{const f=findFood(n)||{k:0,p:0,c:0,f:0};return {n,g,k:f.k,p:f.p,c:f.c,f:f.f}});

function lastKg(planId,pi,i,before){const ks=Object.keys(S.days).filter(k=>k<before).sort().reverse();

function kgHint(w,x,i,date){const e=EX[x.id];if(!e||e.g==='cardio'||e.eq==='geen')return '';const l=lastKg(w.plan.id,w.idx,i,date);if(!l)return '';

  sheet(`<h3>Product zoeken…</h3><p class="mut sm">Barcode ${esc(code)}</p>`);
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,product_name_nl,brands,nutriments,serving_quantity`);
    const j=await r.json(),p=j&&j.product,nu=(p&&p.nutriments)||{};
    let k=nu['energy-kcal_100g'];if((k===undefined||k==='')&&nu['energy_100g']!==undefined)k=nu['energy_100g']/4.184;
    if(!p||j.status!==1||k===undefined||k===''){ownForm({},'Dit product staat nog niet in Open Food Facts. Vul de waarden van het etiket in; de app onthoudt het bij de volgende scan.',code);return}
    const nm=[p.product_name_nl||p.product_name,(p.brands||'').split(',')[0]].filter(Boolean).join(' – ')||'Product '+code;
    const sq=+p.serving_quantity;
    ownForm({n:nm,k:Math.round(+k),p:r1(nu.proteins_100g),c:r1(nu.carbohydrates_100g),f:r1(nu.fat_100g),pn:sq?'portie':'',pg:sq?Math.round(sq):''},'Gevonden in Open Food Facts. Controleer de waarden met het etiket en sla op; daarna herkent de app deze barcode direct.',code);

const CATI={Granen:'bread',Zuivel:'glass',Vlees:'steak',Vis:'fish',Plantaardig:'tofu',Groente:'broccoli',Fruit:'apple',Aardappel:'potato','Noten & vet':'nut','Zoet & snacks':'cookie',Dranken:'glass',Sauzen:'jar',Maaltijden:'plate'};
function foodIco(name,sz=32){
  const n=String(name||'').toLowerCase(),wd=n.split(/[\s(),]+/);
  let k=null,c;
  for(const [kw,ic,col] of FI){if(kw==='ei'||kw==='ui'?wd.includes(kw):n.includes(kw)){k=ic;c=col;break}}
  if(!k){const f=findFood(name);k=(f&&CATI[f.cat])||'plate'}
  return `<svg class="fi" width="${sz}" height="${sz}" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="16" fill="var(--fib)"/>${FG[k](c)}</svg>`;
}
const icoStack=(names,sz=40)=>`<span class="istack">${names.slice(0,4).map(n=>foodIco(n,sz)).join('')}</span>`;

/* ---------- Vaste maaltijden ---------- */
let FX=null;
function fixedApply(date){
  if(date!==today()||!(S.fixed||[]).length)return;
  const d=day(date);d.auto=d.auto||[];let ch=false;
  S.fixed.forEach(f=>{if((f.days||[]).includes(wdOf(date))&&!d.auto.includes(f.id)){f.it.forEach(x=>{const fo=findFood(x.n);if(fo)d.food.push({n:x.n,g:x.g,k:fo.k,p:fo.p,c:fo.c,f:fo.f,m:f.m,fx:f.id})});d.auto.push(f.id);ch=true}});
  if(ch)saveDay(date);
}
function histFood(n){const ks=Object.keys(S.days).sort().reverse();for(const k of ks){const e=(S.days[k].food||[]).find(x=>x.n===n&&x.k>0);if(e)return {k:e.k,p:e.p||0,c:e.c||0,f:e.f||0}}return null}
const fxItems=f=>f.it.map(x=>{const fo=x.k!=null?x:(findFood(x.n)||histFood(x.n)||{k:0,p:0,c:0,f:0});return {n:x.n,g:x.g,k:+fo.k||0,p:+fo.p||0,c:+fo.c||0,f:+fo.f||0,...(x.q?{q:1}:{})}});
const fxIt=e=>({n:e.n,g:R(e.g),k:e.k,p:e.p||0,c:e.c||0,f:e.f||0,...(e.q?{q:1}:{})});
function fixedView(){
  let h=`<p class="sm mut">Maaltijden die je vaak eet. Voeg ze met één tik toe, of laat ze automatisch op vaste dagen in je dagboek zetten.</p>`;
  if(!(S.fixed||[]).length)h+=`<div class="card" style="text-align:center">${icoStack(['Magere kwark','Blauwe bessen','Gemengde noten'],46)}<p class="sm" style="margin:10px 0 0">Bijvoorbeeld elke werkdag als lunch: 500 g magere kwark met blauwe bessen en een handje noten.</p></div>`;
  (S.fixed||[]).forEach(f=>{const its=fxItems(f),t=sumFood(its);
    h+=`<div class="card fx"><div class="row" style="align-items:flex-start">${icoStack(its.map(x=>x.n),40)}<div class="grow"><h3>${esc(f.n)}</h3><small class="mut">${MEALS[f.m]} · ${R(t.k)} kcal · E ${R(t.p)} · K ${R(t.c)} · V ${R(t.f)}</small></div></div><p class="sm" style="margin:8px 0 6px">${its.map(x=>`${esc(x.n)} <span class="mut">${R(x.g)} g</span>`).join(' · ')}</p><div class="row sp"><span class="xs mut">${(f.days||[]).length?'Automatisch op '+[1,2,3,4,5,6,0].filter(w=>f.days.includes(w)).map(w=>DOW[w]).join(', '):'Niet automatisch'}</span></div><div class="g2" style="margin-top:8px"><button data-a="fxedit" data-id="${f.id}">Bewerken</button><button class="grn" data-a="fxadd" data-id="${f.id}" data-m="${f.m}">Zet in vandaag</button></div></div>`});
  h+=`<button class="full pri" data-a="fxnew">+ Nieuwe vaste maaltijd</button>`;
  return h;
}
function fixedSheet(){
  const its=fxItems(FX),t=sumFood(its);
  sheet(`<h3>${FX.id?'Vaste maaltijd bewerken':'Nieuwe vaste maaltijd'}</h3><label class="f"><span>Naam</span><input id="fxn" value="${esc(FX.n)}" placeholder="bijv. Kwark-lunch" data-in="fxn"></label><label class="f"><span>Maaltijd</span><select id="fxm" data-in="fxm">${MEALS.map((x,i)=>`<option value="${i}" ${i===+FX.m?'selected':''}>${x}</option>`).join('')}</select></label>
  <div class="card" style="padding:8px 12px">${its.length?its.map((x,i)=>`<div class="fxr">${foodIco(x.n,34)}<span class="grow">${esc(x.n)}<br><small class="mut">${R(x.k*x.g/100)} kcal</small></span><input inputmode="decimal" value="${R(x.g)}" data-in="fxg" data-i="${i}" aria-label="Gram"><span class="mut sm">g</span><button data-a="fxdel" data-i="${i}" aria-label="Verwijder">✕</button></div>`).join(''):'<p class="sm mut" style="margin:6px 0">Nog geen producten.</p>'}<button class="ghost" data-a="fxaddfood">+ Product toevoegen</button></div>
  <div class="row sp"><b>Totaal</b><b class="num" id="fxtot">${R(t.k)} kcal</b></div>
  <p class="sm" style="margin:14px 0 6px;font-weight:600">Automatisch in je dagboek op</p><div class="chips" style="flex-wrap:wrap">${[1,2,3,4,5,6,0].map(w=>`<button class="chip ${(FX.days||[]).includes(w)?'on':''}" data-a="fxday" data-w="${w}">${DOW[w]}</button>`).join('')}</div>
  <div class="g2" style="margin-top:14px">${FX.id?'<button data-a="fxremove">Verwijderen</button>':'<button data-a="close">Annuleren</button>'}<button class="grn" data-a="fxsave">Opslaan</button></div>`);
}

/* ---------- Render ---------- */
function render(){
  cleanPlans();
  const T={vandaag:['Vandaag',vToday],training:['Training',vTraining],voeding:['Voeding',vVoeding],voortgang:['Voortgang',vVoortgang],profiel:['Profiel',vProfiel]};
  const [ttl,fn]=T[V.tab]||T.vandaag;
  $('#ttl').textContent=ttl;$('#app').innerHTML=fn();
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===V.tab));
  wro.disconnect();const s=document.getElementById('wchart');if(s){wro.observe(s);drawW()}
  startAnim();
}
const go=t=>{V.tab=t;V.edit=null;if(location.hash!=='#'+t)history.replaceState(null,'','#'+t);render();window.scrollTo(0,0)};

/* ---------- Acties ---------- */
const num=v=>parseFloat(String(v).replace(',','.'));
const A={
  tab:b=>go(b.dataset.t),

  confirm:()=>{const f=confirmFn;confirmFn=null;closeSheet();f&&f()},
  set:b=>{
    const date=b.dataset.d,w=todaysWorkout(date);if(!w||w.idx<0)return;

    const i=b.dataset.i,s=+b.dataset.s,arr=d.wk.sets[i]||[];arr[s]=!arr[s];d.wk.sets[i]=Array.from({length:Math.max(arr.length,s+1)},(_,k)=>!!arr[k]);
    saveDay(date);render();
  },
  finish:b=>{const date=b.dataset.d,w=todaysWorkout(date);if(!w||w.idx<0)return;const d=day(date);if(!d.wk||d.wk.pi!==w.idx||d.wk.plan!==w.plan.id)d.wk={plan:w.plan.id,pi:w.idx,sets:{},kg:{},done:false};d.wk.done=!d.wk.done;saveDay(date);render();if(d.wk.done)toast('Lekker bezig! Training opgeslagen.')},
  pickday:()=>{const pl=activePlan();if(!pl){A.genplan();return}sheet(`<h3>Welke training doe je vandaag?</h3>${pl.days.map((dd,i)=>`<button class="li" data-a="setday" data-i="${i}"><span class="t"><b>${esc(dd.name)}</b><small>${dd.ex.length} oefeningen</small></span></button>`).join('')}<button class="li" data-a="setday" data-i="-1"><span class="t"><b>Rustdag</b></span></button>`)},
  setday:b=>{const pl=activePlan(),d=day(today()),i=+b.dataset.i;d.wk={plan:pl.id,pi:i<0?null:i,sets:{},kg:{},done:false};if(i<0)d.wk.pi=-1;saveDay(today());closeSheet();render()},
  extadd:()=>{sheet(`<h3>Andere training toevoegen</h3><div class="chips" style="flex-wrap:wrap;margin-top:8px">${EXT_TYPES.map(([t],i)=>`<button class="chip ${i?'':'on'}" data-a="extt" data-t="${t}">${t}</button>`).join('')}</div><input type="hidden" id="xt" value="Seven"><div class="g2"><label class="f"><span>Minuten</span><input id="xm" inputmode="numeric" value="7" data-in="xm"></label><label class="f"><span>Verbrand (kcal)</span><input id="xk" inputmode="numeric" value="${extKcal('Seven',7)}"></label></div><p class="xs mut">Schatting op basis van je gewicht. Heb je het exacte getal uit Seven of Apple Gezondheid, vul dat dan in.</p><button class="pri full" data-a="extsave">Opslaan</button>`)},
  extt:b=>{document.querySelectorAll('[data-a=extt]').forEach(x=>x.classList.toggle('on',x===b));$('#xt').value=b.dataset.t;$('#xk').value=extKcal(b.dataset.t,num($('#xm').value)||0)},

  extdel:b=>{const d=day(today());(d.ext||[]).splice(+b.dataset.i,1);saveDay(today());render()},

    <ol class="sm" style="padding-left:18px;margin:8px 0"><li>Ga naar <b>console.anthropic.com</b> en maak een account.</li><li>Zet een klein tegoed op je account (bijv. €5).</li><li>Maak bij "API keys" een sleutel en plak hem hieronder.</li></ol>
    <label class="f"><span>API-sleutel</span><input id="aik" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(c.key||'')}"></label>
    <label class="f"><span>Model</span><select id="aim"><option value="claude-sonnet-5-5" ${(c.model||'claude-sonnet-5-5')==='claude-sonnet-5-5'?'selected':''}>Sonnet: nauwkeuriger (aanrader)</option><option value="claude-haiku-5-5" ${c.model==='claude-haiku-5-5'?'selected':''}>Haiku: sneller en goedkoper</option></select></label>
    <p class="xs mut">Kosten: je betaalt per foto aan Anthropic, meestal een paar cent of minder. Bekijk het verbruik in je console.</p>
    <button class="pri full" data-a="aisave">Opslaan</button>${c.key?'<button class="full" style="margin-top:8px" data-a="aidel">Sleutel verwijderen</button>':''}`)},
  aisave:()=>{const k=$('#aik').value.trim();if(k&&!/^sk-ant-/.test(k)){toast('Dit lijkt geen Anthropic-sleutel (begint met sk-ant-)');return}localStorage.setItem(AIK,JSON.stringify({key:k,model:$('#aim').value}));closeSheet();render();toast(k?'Fotoherkenning staat aan':'Opgeslagen')},
  aidel:()=>{localStorage.removeItem(AIK);closeSheet();render();toast('Sleutel verwijderd')},
  wipeall:()=>ask('Alles wissen? Je profiel, schema\'s, eten, gewicht, water en vasten worden verwijderd. Maak eerst een back-up als je iets wilt bewaren. Dit kan niet ongedaan worden gemaakt.',()=>{
    const keys=Object.keys(S.days||{});S={fixed:[],profile:clone(DEF_PROFILE),plans:[],active:null,customFoods:[],weights:[],mealPlan:null,days:{},pins:[],fasts:[],fastCur:null,_t:Date.now()};
    keys.forEach(k=>{S.days[k]={food:[],wk:null,water:0,_t:Date.now()};save('d-'+k)});save('main');
    try{localStorage.removeItem('fitfood_v1');localStorage.removeItem(AIK)}catch(e){}
    setTimeout(()=>{S.days={};try{localStorage.removeItem('fitfood_v1')}catch(e){};V.tab='profiel';render();toast('Alles gewist. Vul je profiel in om te beginnen.')},1500)}),
  selmode:()=>{V.selOn=!V.selOn;V.sel=new Set();render()},
  seltog:b=>{const i=+b.dataset.i;V.sel.has(i)?V.sel.delete(i):V.sel.add(i);render()},
  selmeal:b=>{const m=+b.dataset.m,d=peekDay(V.fdate),ids=d.food.map((e,i)=>e.m===m?i:-1).filter(i=>i>=0),all=ids.every(i=>V.sel.has(i));ids.forEach(i=>all?V.sel.delete(i):V.sel.add(i));render()},
  selmove:()=>{sheet(`<h3>Verplaats ${V.sel.size} ${V.sel.size===1?'product':'producten'} naar</h3><div class="mvgrid">${MEALS.map((x,i)=>`<button class="big" data-a="selmoveto" data-m="${i}">${x}</button>`).join('')}</div>`)},
  selmoveto:b=>{const m=+b.dataset.m,d=day(V.fdate);V.sel.forEach(i=>{if(d.food[i]){d.food[i].m=m;delete d.food[i].fx}});saveDay(V.fdate);const n=V.sel.size;V.sel=new Set();V.selOn=false;closeSheet();render();toast(`${n} verplaatst naar ${MEALS[m].toLowerCase()}`)},
  seldel:()=>ask(`${V.sel.size} ${V.sel.size===1?'product':'producten'} verwijderen?`,()=>{const d=day(V.fdate);d.food=d.food.filter((e,i)=>!V.sel.has(i));saveDay(V.fdate);V.sel=new Set();V.selOn=false;render()}),
  selfix:()=>{const d=peekDay(V.fdate),its=[...V.sel].sort((a,b)=>a-b).map(i=>d.food[i]).filter(Boolean);if(!its.length)return;
    const cnt=[0,0,0,0];its.forEach(e=>cnt[e.m]++);const m=cnt.indexOf(Math.max(...cnt));
    FX={n:'',m,it:its.map(fxIt),days:[]};V.selOn=false;V.sel=new Set();render();fixedSheet();setTimeout(()=>{const n=$('#fxn');if(n)n.focus()},300)},
  fmset:b=>{$('#fm').value=b.dataset.v;document.querySelectorAll('[data-a=fmset]').forEach(x=>x.classList.toggle('on',x===b))},
  restpref:b=>{const v=b.dataset.v;S.profile.rest=v;(S.plans||[]).forEach(pl=>pl.days.forEach(d=>d.kind==='hiit'||d.ex.forEach(x=>{if(!EX[x.id])return;const base=schemeBase(x.id,S.profile.goal);if(!base.rest&&!x.rest)return;x.rest=v==='auto'?base.rest:+v})));save('main');render();toast(v==='auto'?'Rust automatisch ingesteld':'Rust ingesteld op '+fmtRest(+v))},
  plrestset:b=>{const v=+b.dataset.v,x=plEx();x.rest=v;save('main');if(PL.phase==='rest'){Object.assign(PL,{total:v,left:v,end:Date.now()+v*1000});plRender()}},
  pfset:b=>{S.profile[b.dataset.k]=b.dataset.v;if(b.dataset.k==='goal')S.profile.ngoal='';save('main');render()},
  sched:b=>{const p=S.profile,sc={...getSched()},w=+b.dataset.w,cur=sc[w];const nx=!cur?'thuis':cur==='thuis'?'gym':null;if(nx&&!cur&&Object.keys(sc).length>=6){toast('Maximaal 6 trainingsdagen');return}if(nx)sc[w]=nx;else delete sc[w];p.sched=sc;save('main');render()},
  homeeq:b=>{const a=S.profile.homeEq||[],k=b.dataset.k;S.profile.homeEq=a.includes(k)?a.filter(x=>x!==k):a.concat(k);save('main');render()},
  dloc:b=>{const dd=S.plans.find(x=>x.id===V.edit).days[+b.dataset.di];dd.loc=b.dataset.v;save('main');render()},
  exopen:b=>{V.openEx=V.openEx===b.dataset.k?null:b.dataset.k;render()},
  inj:b=>{const k=b.dataset.k,a=S.profile.inj||[];S.profile.inj=a.includes(k)?a.filter(x=>x!==k):a.concat(k);save('main');render()},
  pfonly:()=>{const p=S.profile;if(!(+p.age>0&&+p.cm>0&&+p.kg>0)){toast('Vul leeftijd, lengte en gewicht in');return}save('main');Object.keys(S.days).slice(-3).forEach(d=>save('d-'+d));toast('Profiel opgeslagen')},
  exportfile:()=>exportBackup(),
  importfile:()=>{const i=$('#bkIn');i.value='';i.click()},
  pfsave:()=>{const p=S.profile;if(!(+p.age>0&&+p.cm>0&&+p.kg>0)){toast('Vul leeftijd, lengte en gewicht in');return}
    const first=!p.set;p.set=true;
    if(!S.weights.length)S.weights.push({d:today(),kg:+num(p.kg)});
    const old=S.plans.find(x=>x.id===S.active);
    genPlan();
    genMealPlan();save('main');toast(first?'Je schema\'s zijn klaar':'Nieuw schema gemaakt en geactiveerd; je oude schema\'s staan er nog');go('vandaag')},
  export:async()=>{const t=backupJson();try{await navigator.clipboard.writeText(t);S.lastBackup=Date.now();lsSave();toast('Back-up gekopieerd. Plak hem in bijv. Notities.')}catch(e){sheet(`<h3>Back-up</h3><p class="xs mut">Selecteer alle tekst en kopieer hem.</p><textarea readonly style="min-height:200px">${esc(t)}</textarea>`)}},
  import:()=>sheet(`<h3>Back-up terugzetten</h3><p class="xs mut">Plak hier je back-up. Je huidige gegevens worden vervangen.</p><textarea id="imp"></textarea><button class="pri full" style="margin-top:10px" data-a="doimport">Terugzetten</button>`),
  doimport:()=>{try{restoreBackup($('#imp').value)}catch(e){toast('Dit is geen geldige back-up')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const f=A[b.dataset.a];if(f){e.preventDefault();f(b,e)}});
let kgT;
document.addEventListener('input',e=>{
  const el=e.target,k=el.dataset.in;if(!k)return;
  if(k==='libq'){V.libQ=el.value;$('#liblist').innerHTML=libList(V.libQ,V.libG,'exinfo')}
  else if(k==='pickq'){$('#picklist').innerHTML=libList(el.value,'','pickex',`data-di="${el.dataset.di}"`)}
  else if(k==='fq'){$('#flist').innerHTML=foodList(el.value)}
  else if(k==='fg'){$('#fprev').innerHTML=amountPrev(FS.sel,el.value)}
  else if(k==='kg'){const date=el.dataset.d,w=todaysWorkout(date);if(!w||w.idx<0)return;const d=day(date);if(!d.wk||d.wk.plan!==w.plan.id||d.wk.pi!==w.idx)d.wk={plan:w.plan.id,pi:w.idx,sets:{},kg:{},done:false};d.wk.kg[el.dataset.i]=el.value;clearTimeout(kgT);kgT=setTimeout(()=>saveDay(date),800)}
  else if(k==='pf'&&el.tagName==='INPUT'){const kk=el.dataset.k;S.profile[kk]=kk==='name'?el.value:(el.value===''?'':num(el.value)||'');const c=$('#calc');if(c)c.innerHTML=calcHtml();save('main')}
  else if(k==='xm'){const x=$('#xk');if(x)x.value=extKcal($('#xt').value,num(el.value)||0)}
  else if(k==='fxn'){FX.n=el.value}
  else if(k==='fxg'){const i=+el.dataset.i;FX.it[i].g=num(el.value)||0;const t=sumFood(fxItems(FX)),o=$('#fxtot');if(o)o.textContent=R(t.k)+' kcal'}
  else if(k==='plname'){const pl=S.plans.find(x=>x.id===V.edit);pl.name=el.value;save('main')}
  else if(k==='dname'){S.plans.find(x=>x.id===V.edit).days[+el.dataset.di].name=el.value;save('main')}
  else if(k==='exr'){const x=S.plans.find(p=>p.id===V.edit).days[+el.dataset.di].ex[+el.dataset.i];const o=parseReps(x.reps),kk=el.dataset.k;
    if(kk==='u')o.u=el.value;else{const n=parseInt(el.value)||'';if(kk==='v'){o.v=n;o.v2=''}else o[kk]=n}
    x.reps=buildReps(o)||x.reps;save('main');const sm=el.closest('.exw')&&el.closest('.exw').querySelector('.exl small');if(sm){const e=EX[x.id];sm.textContent=`${x.sets} × ${x.reps}${x.rest?` · ${fmtRest(+x.rest)} rust`:''}`}}
  else if(k==='exf'){const x=S.plans.find(p=>p.id===V.edit).days[+el.dataset.di].ex[+el.dataset.i];x[el.dataset.k]=el.dataset.k==='reps'?el.value:(parseInt(el.value)||0);save('main')}
});
document.addEventListener('change',e=>{
  const el=e.target;if(el.dataset.in==='fxm'&&FX){FX.m=+el.value;return}if(el.dataset.in==='mpg'&&MP){const x=MP.items[+el.dataset.i];x.g=Math.max(0,parseInt(el.value)||0);const t=mpTot(),btn=document.querySelector('[data-a=mpsave]');if(btn)btn.textContent=`Toevoegen · ${R(t.k)} kcal`;const tt=document.querySelector('.mptot b');if(tt)tt.textContent=R(t.k);return}if(el.dataset.in==='pf'){const k=el.dataset.k;let v=el.value;if(['act','days','daily'].includes(k))v=+v;else if(['age','cm','kg','goalkg'].includes(k))v=v===''?'':num(v)||'';S.profile[k]=v;save('main');const c=$('#calc');if(c)c.innerHTML=calcHtml()}
  else if(el.dataset.in==='exf'||el.dataset.in==='plname'||el.dataset.in==='dname')render();
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
const fromHash=()=>{const h=location.hash.slice(1);if(['vandaag','training','voeding','voortgang','profiel'].includes(h)&&h!==V.tab){V.tab=h;V.edit=null;render()}};
window.addEventListener('hashchange',fromHash);
const h0=location.hash.slice(1);if(['vandaag','training','voeding','voortgang','profiel'].includes(h0))V.tab=h0;
$('#bkIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{restoreBackup(String(r.result))}catch(er){toast('Dit bestand is geen geldige back-up')}};r.readAsText(f)});
$('#labelIn').addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readLabel(f)});
['mealIn','mealLib'].forEach(id=>$('#'+id).addEventListener('change',e=>{const f=e.target.files&&e.target.files[0];if(f)readMeal(f)}));
(async()=>{try{if(!IN_CLAUDE)return;const s=await window.claude.use('sample');if(!s)return;let ok=true;try{const l=s.limits?await s.limits():null;if(l&&l.images===false)ok=false}catch(e){}if(ok)SAMPLE=s}catch(e){}})();
try{const qp=new URLSearchParams(location.search);if(qp.get('log')){addExt(qp.get('log').slice(0,40),num(qp.get('min'))||7,num(qp.get('kcal')));history.replaceState(null,'',location.pathname+'#vandaag');V.tab='vandaag';setTimeout(()=>toast(qp.get('log')+'-training toegevoegd'),300)}}catch(e){}
setSync('local');render();initDb();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
}
</script>
